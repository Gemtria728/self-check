<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 삶의 위치를 알아볼 수 있는 질문</title>
<style>
:root{--navy:#1a2b4a;--teal:#1f7e79;--cream:#f6f0e1;--gold:#b8923a;--ink:#222}
*{box-sizing:border-box}
html{font-size:15px;-webkit-text-size-adjust:100%}
@media (max-width:700px) and (orientation:portrait){html{font-size:18px}}
body{margin:0;background:#fbf8f0;color:var(--ink);font-family:"Apple SD Gothic Neo","Apple SD 산돌고딕 Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.85}
main{max-width:44rem;margin:0 auto;padding:1.4rem 14px 4rem}
p{margin:.7em 0;text-align:justify;word-break:keep-all;overflow-wrap:break-word}
h1{font-size:1.9em;line-height:1.35;color:var(--navy);margin:.3em 0 .4em}
h3{font-size:1.15em;color:var(--teal);margin:1.6em 0 .3em}
.rule{border:0;border-top:2px solid var(--gold);margin:.8em 0 1.2em}
.bar{height:8px;background:#e6dfcc;border-radius:4px;margin:0 0 1.2em;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.stagehead{color:var(--teal);margin:0 0 1em}
.nar{background:var(--cream);border-left:5px solid var(--gold);padding:12px 16px;margin:0 0 16px}
.nar p{margin:0}
.q{background:#fff;border:1px solid #d9cfb4;border-left:5px solid var(--teal);padding:14px 16px;margin:0 0 16px}
.q .t{margin:0 0 .6em;font-weight:600;color:var(--navy)}
.opt{display:block;margin:6px 0;padding:10px 12px;border:1px solid #cfc6b0;background:#fffdf7;cursor:pointer;line-height:1.6;text-align:justify;word-break:keep-all}
.opt input{margin-right:8px;transform:scale(1.2)}
.opt:has(input:checked){background:var(--cream);border-color:var(--teal)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:1.4em}
button{font:inherit;padding:.7em 1.2em;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--teal)}
.note{font-size:.9em;color:#555}
.card{background:#fff;border:1px solid #d9cfb4;padding:14px 16px;margin:0 0 14px}
.card.on{border-color:var(--gold);border-width:2px}
.card h4{margin:0 0 .3em;color:var(--navy);font-size:1.1em}
.meter{display:flex;gap:4px;margin:.3em 0 .6em}
.meter b{flex:1;height:10px;background:#e6dfcc}
.meter b.on{background:var(--teal)}
.pos{background:var(--cream);border-left:5px solid var(--gold);padding:12px 16px;margin:1em 0}
.hidden{display:none}
@media print{button,.nav,.bar{display:none}body{background:#fff}}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>
<script>
var SC=[{"narr":"오랫동안 믿어 온 배우자에 대한 믿음에 금이 가는 일이 생겼습니다. 이것은 서운함의 이야기가 아닙니다. 그동안 불안정했던 결혼생활에서 가장 중요한 것은 신뢰의 문제인데, 배우자가 이런 일을 벌인 것이 이번이 처음이 아니라는 사실이 정말 위기입니다.","q1":"그날 밤 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"마음은 아파도 아침이 오면 하던 일을 해요. 그 일과 이 일을 따로 떼어 놓고 있어요.","s":3},{"t":"화가 나다가도 내가 뭘 놓쳤나 싶어서 마음이 오락가락해요.","s":1},{"t":"이 사람과는 끝이다 싶어요. 내가 당한 일을 누구에게든 말하고 싶고, 가만히 있으면 나만 바보가 되는 것 같아요.","s":0},{"t":"믿음이 어디서부터 깨졌는지 하나씩 짚어 보게 돼요.","s":2}],"q2":"이 일의 원인은 무엇이라고 생각하십니까?","o2":["배우자의 자질에 문제가 있어요.","그 사람은 타고나기를 한 사람에게 만족하지 못하는 사람이에요.","그 사람을 만족시키기에는 내가 부족한 사람이에요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"딱 하나라고 말하기가 어렵네요. 상대 몫과 내 몫이 뒤섞여 있는 것 같은데, 어디서부터 나눠야 할지 잘 모르겠어요.","s":1},{"t":"우리 사이에는 오래된 방식이 있었던 것 같아요. 각자 맡아 온 몫이 보이고, 이번 일도 그 방식이 되풀이된 거라는 걸 알겠어요.","s":2},{"t":"원인을 따지는 건 이제 크게 중요하지 않아요. 이 일을 겪고 나서 내가 어떻게 살아갈지가 더 궁금해요.","s":3}]},{"narr":"부모님이 갑자기 쓰러지셨습니다. 형제들은 멀리 있거나 바쁘다는 이유로, 돌봄이 고스란히 내게 왔습니다. 몇 달이 지나도 끝이 보이지 않고, 내 일도 내 건강도 하나씩 무너져 갑니다. 내 삶이 통째로 멈춰 선 느낌입니다.","q1":"병원에서 돌아오는 길, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"왜 나만 이래야 하는지 모르겠어요. 다들 편하게 사는데 나 혼자 다 짊어진 것 같아서 하루에도 몇 번씩 화가 올라와요.","s":0},{"t":"해야 하는 일인 줄은 알아요. 그런데 이 자리를 피하고 싶어 하는 내 마음이 보여서 스스로가 낯설어요.","s":1},{"t":"힘들어도 병원에 가고 밥을 챙기는 하루는 이어 가요. 오늘 할 수 있는 만큼만 해요.","s":3},{"t":"내가 맡을 수 있는 몫과 형제들이 나누어야 할 몫이 따로 보여요. 그걸 말로 꺼내 보자고 마음먹게 돼요.","s":2}],"q2":"이 상황이 이렇게 된 원인은 무엇이라고 생각하십니까?","o2":["형제들이 자기밖에 모르는 사람들이에요.","부모님이 평생 자식에게 기대고 살아오신 분이에요.","내가 잘못 살아서 이런 일이 내게 온 것 같아요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"누구 탓인지는 이제 중요하지 않아요. 이 시간을 지나고 나면 내가 어떻게 살지가 더 궁금해요.","s":3},{"t":"우리 집에는 오래된 역할 나눔이 있었어요. 그 안에서 내가 맡아 온 몫이 이번 일로 드러난 것 같아요.","s":2},{"t":"형제 문제인지, 부모님 문제인지, 내 문제인지 한 덩어리로 뒤섞여 있어서 어디서부터 풀어야 할지 모르겠어요.","s":1}]},{"narr":"오랫동안 함께 일해 온 사람이 내가 하지도 않은 일로 여러 사람 앞에서 나를 비난했습니다. 해명할 시간은 짧았고, 그 뒤로 사람들의 눈빛이 달라진 것이 느껴집니다. 내 이름과 내 자리가 걸린 일입니다.","q1":"그 일이 있은 지 사흘째, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"그 사람의 말과 내 마음을 따로 놓고 보게 돼요. 무엇을 해명하고 어디서 멈출지 정리해 보고 있어요.","s":2},{"t":"억울한데, 사람들이 나를 그렇게 볼 만한 구석이 내게도 있었나 싶어서 마음이 흔들려요.","s":1},{"t":"마음은 쓰라려도 맡은 일을 하고 사람들을 평소처럼 대해요. 시간이 말해 줄 거라고 생각해요.","s":3},{"t":"그 사람이 한 말을 계속 곱씹느라 잠을 못 자요. 사람들 앞에서 그 사람이 어떤 사람인지 밝히고 싶어요.","s":0}],"q2":"이런 일이 벌어진 원인은 무엇이라고 생각하십니까?","o2":["그 사람이 원래 질투가 많고 말을 만들어 내는 사람이에요.","이 조직이 사람을 몰아세우는 곳이에요.","내가 평소에 사람들에게 미움 살 만한 행동을 했나 봐요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"이 관계에는 오래전부터 쌓인 방식이 있었어요. 이번 일이 그 방식의 결과라는 게 보여요.","s":2},{"t":"누가 옳은지 가리는 것보다, 이 일을 지나고 나서 내가 어떤 사람으로 서 있을지가 더 마음에 걸려요.","s":3},{"t":"그 사람 탓도 있고 내 탓도 있는 것 같은데, 어디까지가 누구 몫인지 흐릿해요.","s":1}]},{"narr":"아이가 학교에서 큰 문제를 일으켰다는 연락을 받았습니다. 이번이 처음이 아니고, 담임 선생님과 다른 부모들의 시선이 달라졌습니다. 부모로서 내가 살아온 방식 전체가 흔들립니다.","q1":"전화를 끊고 난 뒤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"아이의 몫과 내 몫을 나누어 보게 돼요. 아이에게 먼저 무엇을 물어볼지 정리해요.","s":2},{"t":"아이를 탓하다가도 내 모습이 아이에게 비치는 것 같아서 마음이 복잡해요.","s":1},{"t":"걱정은 되지만 저녁에는 아이와 식탁에 평소처럼 마주 앉아요.","s":3},{"t":"아이한테 화가 치밀어요. 이런 아이를 키운 사람으로 나를 어떻게 볼지가 제일 신경 쓰여요.","s":0}],"q2":"이 일의 원인은 무엇이라고 생각하십니까?","o2":["아이가 타고나기를 고집이 세고 말을 안 듣는 아이예요.","배우자가 아이 교육에 전혀 신경을 안 써요.","나는 부모 자격이 없는 사람이에요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"아이 문제, 배우자 문제, 내 문제가 한 덩어리로 섞여 있어서 어디서부터 풀지 모르겠어요.","s":1},{"t":"우리 집에 오래된 말투와 분위기가 있었어요. 아이의 행동이 그걸 비춰 주고 있는 것 같아요.","s":2},{"t":"누구 탓인지보다 이 일을 지나고 나서 아이와 내가 어떤 사이로 살게 될지가 더 궁금해요.","s":3}]},{"narr":"수년 동안 헌신해 온 공동체에서, 내가 맡아 온 일이 하루아침에 다른 사람에게 넘어갔습니다. 아무도 내게 이유를 설명해 주지 않았습니다. 내가 쏟은 시간과 마음이 아무것도 아니었다는 느낌이 떠나지 않습니다.","q1":"그 소식을 들은 날 밤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"서운함은 있어요. 그래도 다음 날 할 수 있는 자리에서 할 수 있는 일을 해요.","s":3},{"t":"억울하면서도 내가 인정받고 싶어서 그렇게 매달렸나 하는 생각이 스쳐 가요.","s":1},{"t":"내가 이렇게까지 했는데 싶은 마음이 떠나지 않아요. 다시는 그 일에 손대고 싶지 않아요.","s":0},{"t":"내가 해 온 일의 의미와 인정받고 싶은 마음을 따로 떼어서 보게 돼요.","s":2}],"q2":"이런 일이 생긴 원인은 무엇이라고 생각하십니까?","o2":["그 공동체 지도자가 사람을 공정하게 대하지 못하는 사람이에요.","그 조직은 원래 사람을 쓰고 버리는 곳이에요.","내가 능력이 모자라거나 헌신이 부족했나 봐요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"원인을 따지는 일은 크게 중요하지 않아요. 이 일 뒤에 내가 어디서 어떻게 살아갈지가 더 궁금해요.","s":3},{"t":"지도자 탓도 있고 내 탓도 있는 것 같은데, 어디까지가 어느 쪽 몫인지 잘 모르겠어요.","s":1},{"t":"이 공동체에는 사람을 대하는 오래된 방식이 있었어요. 내가 그 안에서 맡아 온 자리도 이제 보여요.","s":2}]},{"narr":"오랫동안 준비해 온 일이 마침내 크게 열매를 맺었습니다. 사람들의 축하와 칭찬이 쏟아지고, 이제 더 큰 자리로 올라가야 한다는 말도 들립니다. 이 자리에서 무엇을 쥐고 무엇을 내려놓을지 정해야 합니다.","q1":"축하 인사를 받고 난 밤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"이 열매가 어디서 왔는지 돌아보고, 누구와 어떻게 나눌지 생각해요.","s":2},{"t":"기쁘면서도 이 칭찬을 받을 자격이 정말 있나 싶어서 불안해요.","s":1},{"t":"이제야 내가 인정받는구나 싶어요. 이 자리를 누구에게도 빼앗기고 싶지 않아요.","s":0},{"t":"기쁨은 기쁨대로 두고, 다음 날도 하던 일과 사람들을 평소처럼 대해요.","s":3}],"q2":"이 열매는 무엇 덕분이라고 생각하십니까?","o2":["남들보다 내가 더 많이 노력하고 더 잘 알았기 때문이에요.","아무도 나를 도와주지 않았어도 나 혼자 해냈어요.","그냥 운이 좋았을 뿐이고 내 몫은 거의 없어요."],"q3":"그렇다면 이 열매에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"이 열매는 오래전부터 쌓인 것들이 이어져서 맺힌 거라는 걸 알아요. 내 몫과 다른 사람들 몫이 각각 보여요.","s":2},{"t":"누구 덕분인지는 크게 중요하지 않아요. 이 열매를 가지고 이제 어떻게 살아갈지가 더 궁금해요.","s":3},{"t":"내 노력도 있고 주변의 도움도 있었는데, 어디까지가 내 몫인지 딱 잘라 말하기가 어려워요.","s":1}]},{"narr":"오랫동안 해 온 사역이 어느 날부터 아무 열매도 없는 것처럼 느껴졌습니다. 기도해도 응답은 없고, 함께 시작한 사람들은 하나둘 떠납니다. 내가 서 있는 자리의 의미가 흔들립니다.","q1":"아무도 없는 예배당이나 서재에서, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"다 소용없다 싶어요. 떠난 사람들과 나를 이렇게 만든 상황이 원망스러워요.","s":0},{"t":"이 침묵 속에서 내가 그동안 피해 온 마음이 올라와요. 그걸 마주하고 있어요.","s":1},{"t":"기도는 이어 가고, 하던 일을 하면서 하루를 보내요.","s":3},{"t":"응답이 없는 이 시간이 내게 무엇을 가르치려는지 조용히 묻게 돼요.","s":2}],"q2":"이런 상황의 원인은 무엇이라고 생각하십니까?","o2":["함께 시작한 사람들이 끈기가 없었어요.","시대가 달라져서 이런 사역은 이제 통하지 않아요.","내 믿음이 부족해서 이런 일이 생겼어요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"사람들 문제, 시대 문제, 내 문제가 다 있는 것 같은데 어디서부터 따져야 할지 모르겠어요.","s":1},{"t":"이 사역이 처음 시작된 방식과 내가 이어 온 방식에 오래된 틀이 있었어요. 그게 지금 한계에 닿은 것 같아요.","s":2},{"t":"원인을 찾는 일은 크게 중요하지 않아요. 이 시간 뒤에 내가 어떤 자리에서 어떻게 살지가 더 궁금해요.","s":3}]}];
var ST4=[{"name":"흑화(Nigredo)","short":"흑화","title":"무너짐과 내려놓음","hint":"붙들고 있던 것이 흔들리는 자리입니다. 원인을 한쪽에 두고 버티는 마음은 새로 시작하려는 신호일 수 있습니다."},{"name":"백화(Albedo)","short":"백화","title":"씻김과 직면","hint":"내 몫이 어렴풋이 보이지만 아직 뒤섞여 있는 자리입니다. 천천히 나누어 가도 괜찮습니다."},{"name":"황화(Citrinitas)","short":"황화","title":"인격이 익어 가는 자리","hint":"일의 구조가 보이고 각자의 몫을 나누어 볼 수 있는 자리입니다. 깨달음이 인품으로 익어 가고 있습니다."},{"name":"적화(Rubedo)","short":"적화","title":"삶으로 완성되는 자리","hint":"이해가 일상 속으로 스며든 자리입니다. 이 자리는 끝이 아니라 새로운 순환의 시작입니다."}];

var NOTE=[{"m":"자아가 쌓아 온 통제 체계가 무너질 때 원인을 상대, 조직, 환경 또는 자신의 결함 한쪽에 가두는 방어 기제입니다. 투사와 자기 비난은 방향만 다를 뿐 모두 원인을 한 곳에 고정해 해체 불안을 견디려는 역동입니다.","o":"'그 사람 때문에' 혹은 '내가 부족해서'라는 단정적 언어가 반복되는지, 불면과 긴장 같은 신체 반응과 과도한 통제 시도가 함께 나타나는지 관찰합니다."},{"m":"투사를 거두기 시작해 내 몫을 인식하지만, 상대의 몫과 내 몫이 아직 구분되지 않고 뭉뚱그려진 상태입니다. 감정 정화와 그림자 인식이 시작되었으나 구조화되지는 않았습니다.","o":"'둘 다 있는 것 같은데 모르겠다'는 말이 잦은지, 억울함과 자기 점검 사이에서 감정이 오가는지 살핍니다."},{"m":"사건의 구조를 알아보고 각자의 몫을 나누어 보는 통찰의 단계입니다. 자아 중심에서 더 큰 맥락으로 시선이 옮겨 가며 감정이 가라앉고 인격화가 시작됩니다.","o":"사건을 오래된 관계 방식과 역할의 맥락으로 설명하는지, 상대를 향한 정죄가 줄고 구체적인 선택이 나오는지 확인합니다."},{"m":"이해가 삶으로 통합되어 따로 설명할 필요가 없어진 상태입니다. 원인 분석보다 이후의 삶의 방향이 관심의 중심이 되고, 일상의 평정과 나눔으로 드러납니다.","o":"일상의 리듬을 유지하는지, 사건을 삶의 한 부분으로 담담히 말하는지, 다음 여정에 열려 있는지 봅니다. 감정을 눌러 두는 회피와 구별하기 위해 신체 반응과 표정도 함께 살핍니다."}];
function analyze(ans,SC){
 var cnt=[0,0,0,0],mm=[0,0,0],mmT=0,rows=[];
 for(var n=1;n<=SC.length;n++){
  var a=ans[n]||[0,0,0],sc=SC[n-1];
  var f=a[0]?sc.o1[a[0]-1].s:-1;
  var t=a[1]?(a[1]<=3?0:(a[2]?sc.o3[a[2]-1].s:-1)):-1;
  if(f>=0)cnt[f]++;if(t>=0)cnt[t]++;
  if(f>=0&&t>=0&&Math.abs(f-t)==1){mm[Math.min(f,t)]++;mmT++;}
  rows.push({f:f,t:t});
 }
 var tc=[0,0,0,0];rows.forEach(function(r){if(r.t>=0)tc[r.t]++;});
 var p=0;for(var i=1;i<4;i++){if(cnt[i]>cnt[p]||(cnt[i]==cnt[p]&&tc[i]>tc[p]))p=i;}
 var best=0;for(i=1;i<3;i++)if(mm[i]>mm[best])best=i;
 var tr=(mmT>=4&&(best==1||best==2))?best-1:-1;
 return {cnt:cnt,p:p,tr:tr,rows:rows,tc:tc};
}
function posName(r,ST4,TR){return r.tr>=0?TR[r.tr]:ST4[r.p].short;}

 if(API_URL){
  h+='<p class="note">인도자에게 받은 접속번호를 입력해 주세요.</p>'+
   '<p><input id="code" inputmode="numeric" autocomplete="off" placeholder="접속번호" value="'+esc(CODE)+'" style="font:inherit;padding:.6em .8em;width:12em;border:1px solid #cfc6b0"></p>'+
   '<p id="cmsg" class="note"></p>';
 }else{
  h+='<p class="note">답은 이 기기 안에만 저장되며 어디로도 전송되지 않습니다.</p>';
 }
 h+='<div class="nav"><span></span><button id="go">'+(has?'이어서 하기':'시작하기')+'</button></div>'+
  (has?'<p class="note"><a href="#" id="reset">처음부터 다시 하기</a></p>':'');
 app.innerHTML=h;
 document.getElementById("go").onclick=function(){

 };

}
function page(){
 var n=step+1,sc=SC[step],a=ans[n]||[0,0,0],h='';
 h+='<div class="bar"><i style="width:'+Math.round(step/SC.length*100)+'%"></i></div>';
 h+='<p class="stagehead">장면 '+n+' / '+SC.length+'</p>';
 h+='<div class="nar"><p>'+esc(sc.narr)+'</p></div>';
 h+='<div class="q"><p class="t">'+esc(sc.q1)+'</p>'+opts("a1",sc.o1,a[0],function(o){return o.t;})+'</div>';
 var o2=sc.o2.concat(["해당 항목 없음"]);
 h+='<div class="q"><p class="t">'+esc(sc.q2)+'</p>'+opts("a2",o2,a[1],function(o){return o;})+'</div>';
 h+='<div class="q'+(a[1]==4?'':' hidden')+'" id="q3box"><p class="t">'+esc(sc.q3)+'</p>'+opts("a3",sc.o3,a[2],function(o){return o.t;})+'</div>';
 h+='<p id="warn" class="note hidden">답하지 않은 질문이 있습니다.</p>';
 h+='<div class="nav"><button class="ghost" id="back">이전</button><button id="next">'+(step==SC.length-1?'결과 보기':'다음')+'</button></div>';
 app.innerHTML=h;
 var radios=app.querySelectorAll("input[type=radio]");
 for(var i=0;i<radios.length;i++)radios[i].onchange=function(){
  var v=ans[n]||[0,0,0];var val=parseInt(this.value);
  if(this.name=="a1")v[0]=val;
  if(this.name=="a2"){v[1]=val;if(val!=4){v[2]=0;var r3=document.getElementsByName("a3");for(var k=0;k<r3.length;k++)r3[k].checked=false;}document.getElementById("q3box").className="q"+(val==4?"":" hidden");}
  if(this.name=="a3")v[2]=val;
  ans[n]=v;save();document.getElementById("warn").className="note hidden";
 };
 document.getElementById("back").onclick=function(){if(step==0)intro();else{step--;page();window.scrollTo(0,0);}};
 document.getElementById("next").onclick=function(){
  var v=ans[n]||[0,0,0];
  if(!v[0]||!v[1]||(v[1]==4&&!v[2])){document.getElementById("warn").className="note";return;}
  if(step==SC.length-1)result();else{step++;page();window.scrollTo(0,0);}
 };
}
function result(){
 var R=analyze(ans,SC),total=SC.length*2;
 var h='<h1>'+(NAME?esc(NAME)+' 님의 지금 위치':'나의 지금 위치')+'</h1><hr class="rule">';
 h+='<div class="pos"><p style="margin:0">';
 if(R.tr>=0)h+='지금은 <b>'+ST4[R.tr+1].short+'</b>과 <b>'+ST4[R.tr+2].short+'</b> 사이, 건너가는 자리를 걷고 계십니다. 한 자리에서 다음 자리로 건너가는 일은 누구에게나 쉽지 않고, 더디게 느껴지는 것은 그만큼 큰 건너감이기 때문입니다.';
 else h+='가장 뚜렷하게 드러난 자리는 <b>'+ST4[R.p].name+'</b>, 곧 '+ST4[R.p].title+'의 자리입니다.';
 h+='</p></div><h3>네 자리의 모습</h3>';
 for(var i=0;i<4;i++){
  var S=ST4[i],on=R.cnt[i]?Math.min(4,Math.ceil(R.cnt[i]/(total/4))):0;
  var isOn=(R.tr>=0)?(i==R.tr+1||i==R.tr+2):(i==R.p);
  h+='<div class="card'+(isOn?' on':'')+'"><h4>'+S.name+'</h4><p class="note" style="margin:0">'+S.title+'</p><div class="meter">';
  for(var k=1;k<=4;k++)h+='<b'+(k<=on?' class="on"':'')+'></b>';
  h+='</div><p style="margin:.2em 0">'+S.hint+'</p></div>';
 }
 h+=(API_URL&&CODE?'<p id="sendmsg" class="note"></p>':'');
 h+='<div class="nav"><button class="ghost" id="again">처음부터 다시</button><button id="print">저장 또는 인쇄</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById("again").onclick=function(){ans={};save();step=0;intro();};
 document.getElementById("print").onclick=function(){window.print();};
 if(API_URL&&CODE)sendResult(posName(R,ST4,TR));
}
intro();
</script>
</body>
</html>
