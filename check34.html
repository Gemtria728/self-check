<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 삶의 위치를 알아볼 수 있는 질문</title>
<style>
:root{--navy:#1a2b4a;--teal:#1f7e79;--cream:#f6f0e1;--gold:#b8923a;--ink:#222}
*{box-sizing:border-box}
html{font-size:15px;-webkit-text-size-adjust:100%}
@media (max-width:700px) and (orientation:portrait){html{font-size:18px}}
body{margin:0;background:#fbf8f0;color:var(--ink);font-family:"Apple SD Gothic Neo","Apple SD 산돌고딕 Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.85}
main{max-width:44rem;margin:0 auto;padding:1.4rem 14px 4rem}
p{margin:.7em 0;text-align:justify;word-break:keep-all;overflow-wrap:break-word}
h1{font-size:1.9em;line-height:1.35;color:var(--navy);margin:.3em 0 .4em}
h3{font-size:1.15em;color:var(--teal);margin:1.6em 0 .3em}
.rule{border:0;border-top:2px solid var(--gold);margin:.8em 0 1.2em}
.bar{height:8px;background:#e6dfcc;border-radius:4px;margin:0 0 1.2em;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.stagehead{color:var(--teal);margin:0 0 1em}
.nar{background:var(--cream);border-left:5px solid var(--gold);padding:12px 16px;margin:0 0 16px}
.nar p{margin:0}
.q{background:#fff;border:1px solid #d9cfb4;border-left:5px solid var(--teal);padding:14px 16px;margin:0 0 16px}
.q .t{margin:0 0 .6em;font-weight:600;color:var(--navy)}
.opt{display:block;margin:6px 0;padding:10px 12px;border:1px solid #cfc6b0;background:#fffdf7;cursor:pointer;line-height:1.6;text-align:justify;word-break:keep-all}
.opt input{margin-right:8px;transform:scale(1.2)}
.opt:has(input:checked){background:var(--cream);border-color:var(--teal)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:1.4em}
button{font:inherit;padding:.7em 1.2em;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--teal)}
.note{font-size:.9em;color:#555}
.card{background:#fff;border:1px solid #d9cfb4;padding:14px 16px;margin:0 0 14px}
.card.on{border-color:var(--gold);border-width:2px}
.card h4{margin:0 0 .3em;color:var(--navy);font-size:1.1em}
.meter{display:flex;gap:4px;margin:.3em 0 .6em}
.meter b{flex:1;height:10px;background:#e6dfcc}
.meter b.on{background:var(--teal)}
.pos{background:var(--cream);border-left:5px solid var(--gold);padding:12px 16px;margin:1em 0}
.hidden{display:none}
@media print{button,.nav,.bar{display:none}body{background:#fff}}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>
<script>
var SC=[{"title":"교인들의 등 돌림","narr":"오랫동안 정성을 다해 돌봐 온 교인들이 중요한 결정의 순간에 나를 등졌습니다. 몇 사람은 뒤에서 나를 흉보고 교회를 떠났습니다. 이것은 서운함의 이야기가 아닙니다. 가장 아끼던 사람이 앞장섰고, 이런 일이 처음이 아니라는 사실이 정말 위기입니다.","q1":"그날 밤 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"아프고 쓸쓸한데, 떠난 사람들 얼굴이 떠오르면 이상하게 보고 싶고 안쓰러워요.","s":3},{"t":"배신감이 커요. 그런데 그 사람들이 나한테 뭘 바랐는지 내가 물어본 적이 있나 싶은 생각이 자꾸 들어요.","s":1},{"t":"그 이름들이 머릿속에서 안 지워져요. 내가 어떻게 해 준 사람들인데 싶어서, 다시는 마음을 열고 싶지 않아요.","s":0},{"t":"그 사람들이 왜 그렇게까지 했을까, 그동안 얼마나 힘들었을까 하는 생각이 먼저 들어요. 나한테 한 말보다 그 말 뒤에 있던 사정이 궁금해요.","s":2}],"q2":"이 일의 원인은 무엇이라고 생각하십니까?","o2":["교인들의 신앙 수준이 거기까지인 거예요.","그 사람들은 원래 자기 이익이 걸리면 돌아서는 사람들이에요.","내가 목회자로서 부족해서 사람들이 떠나는 거예요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"내가 부족했던 건지 그 사람들이 변한 건지 모르겠어요. 이 말도 맞는 것 같고 저 말도 맞는 것 같아서 마음이 왔다 갔다 해요.","s":1},{"t":"내가 챙긴다고 한 게 어떤 사람한테는 숨 막혔을 수 있겠다 싶어요. 그 사람들도 상처가 있었는데 내가 못 봤어요.","s":2},{"t":"이 일은 내 안에서 어느 정도 자리가 잡혔어요. 아프긴 한데, 덕분에 교인 한 사람 한 사람이 더 귀하게 보여요.","s":3}]},{"title":"식어 가는 부르심","narr":"신학교에 가던 때와 첫 사역지로 향하던 때의 뜨거움이 어느새 기억 속에만 남았습니다. 설교도 심방도 해야 하니까 하는 일처럼 느껴지고, 이 일을 왜 시작했는지 선뜻 대답할 말이 떠오르지 않습니다. 내가 목회자로 부름받은 것이 맞는지가 흔들립니다.","q1":"일요일 저녁 설교를 마치고 혼자 앉았을 때, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"이 일이 나를 다 닳게 했어요. 사람들은 계속 바라기만 하고, 나는 이제 줄 게 하나도 없어요.","s":0},{"t":"처음 마음이 식은 게 혹시 내가 인정받고 잘되는 쪽에 마음을 더 써서 그런 건 아닌가, 좀 찔려요.","s":1},{"t":"뜨겁지는 않아요. 그래도 마음 바닥에 잔잔한 사랑이 있어서, 강단에 서면 지금도 가슴이 뛰어요.","s":3},{"t":"처음 부르심 받던 때의 내가 안쓰럽기도 하고 고맙기도 해요. 그때 그 사람을 이렇게 닳게 한 게 뭐였는지 하나씩 짚어 보고 있어요.","s":2}],"q2":"이 열정이 식은 원인은 무엇이라고 생각하십니까?","o2":["교회가 목회자를 소모품처럼 쓰는 구조라서 그래요.","나는 원래 오래 불타오르는 기질이 아니에요.","내가 처음 받은 은혜를 지키지 못한 불성실한 사람이에요."],"q3":"그렇다면 이 식어 감에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"뜨거움은 예전 같지 않은데 이 부르심은 틀림없다는 확신이 있어요. 지금 이 자리가 감사하고 편안해요.","s":3},{"t":"그때 뜨거웠던 건 젊어서이기도 했어요. 지금의 나를 자꾸 몰아세우지 말고, 이 나이에 맞는 부르심의 모습을 기다려 보고 싶어요.","s":2},{"t":"교회 사정 때문인 것도 같고 내 탓인 것도 같고 모르겠어요. 한쪽으로 생각하면 다른 쪽이 걸려요.","s":1}]},{"title":"내려놓은 직함","narr":"안식월을 맞아 한 달 동안 강단과 당회, 심방에서 모두 물러나게 되었습니다. 아무도 나를 목사님이라고 부르지 않는 시간이 이어지자, 이 이름과 역할을 빼면 내가 누구인지 대답하기 어렵습니다. 낯선 곳에 이름 없이 서 있는 느낌이 듭니다.","q1":"안식월 둘째 주, 아침에 눈을 떴을 때 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"직함 벗은 내가 낯설고 한편으로는 짠해요. 오랫동안 역할만 입고 살았으니, 내 마음부터 좀 돌봐 주고 싶어요.","s":2},{"t":"목사라는 이름 뒤에 숨어 있던 내 모습이 보이니까 낯설어요. 직함 없는 나도 괜찮은 사람일까 싶고요.","s":1},{"t":"직함이 없어도 마음이 허전하지 않아요. 아침 햇살만 봐도 감사하고, 식구들이랑 앉아 있으면 가슴이 따뜻해요.","s":3},{"t":"할 일이 없으니 내가 쓸모없는 사람 같아요. 교회가 나 없이도 잘 돌아간다는 얘기가 서운하고 불안해요.","s":0}],"q2":"이런 공허함의 원인은 무엇이라고 생각하십니까?","o2":["교회가 목회자를 일에만 묶어 두고 개인의 삶은 돌보지 않아서 그래요.","나는 원래 일이 아니면 의미를 못 찾는 사람이에요.","내가 사역에만 매달려 신앙이 얕아진 거예요."],"q3":"그렇다면 이 공허함에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"나는 오랫동안 역할로만 나를 불렀어요. 한 번도 못 쉰 내 마음이 안쓰러워서, 이제는 이름으로도 불러 주고 싶어요.","s":2},{"t":"사역 밖에서도 내가 귀한 사람이라는 게 느껴져요. 목사님으로 불리든 이름으로 불리든 나는 똑같아요.","s":3},{"t":"교회가 문제인지 내 습관이 문제인지 모르겠어요. 둘 다인 것 같기도 하고, 둘 다 아닌 것 같기도 하고요.","s":1}]},{"title":"자녀의 방황","narr":"아이가 사춘기에 접어들면서 교회 안팎에서 문제를 일으켰습니다. 목회자 자녀라는 이유로 아이를 보는 교인들의 시선이 더 날카롭고, 아이는 교회에 가기 싫다고 합니다. 부모로서도 목회자로서도 내가 살아온 방식 전체가 흔들립니다.","q1":"아이와 다투고 난 뒤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"아이가 학교에서 얼마나 힘들었을까 하는 생각이 먼저 들어요. 말썽 뒤에 어디가 다쳤는지, 아이 얘기부터 들어 주고 싶어요.","s":2},{"t":"아이를 탓하다가도, 교회 일 한다고 곁에 못 있어 준 내 모습이 떠올라서 마음이 복잡해요.","s":1},{"t":"걱정되고 속상해서 가슴이 먹먹해요. 그래도 아이 얼굴을 떠올리면 화는 금방 사라지고 안아 주고 싶은 마음만 남아요.","s":3},{"t":"아이한테 화가 확 올라와요. 목회자 자식이 이래서 되겠냐는 소리가 제일 신경 쓰여요.","s":0}],"q2":"아이가 이렇게 된 원인은 무엇이라고 생각하십니까?","o2":["교인들이 목회자 자녀를 너무 감시해서 아이가 삐뚤어졌어요.","아이가 타고나기를 고집이 세고 말을 안 듣는 아이예요.","나는 목회자로서도 부모로서도 자격이 없어요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"교회 환경 때문인가, 아이 성격인가, 내 탓인가. 생각할 때마다 답이 달라져서 정리가 안 돼요.","s":1},{"t":"우리 집은 교회 일이 늘 먼저였고, 아이는 그 사이에서 혼자 외로웠을 거예요. 이번 일은 아이가 보내는 신호 같아요.","s":2},{"t":"아이의 방황이 아프지만, 이 시간 덕분에 아이와 내가 더 가까워지는 게 느껴져요. 아이 곁에 있으면 마음이 놓여요.","s":3}]},{"title":"사임 권유","narr":"수년 동안 헌신해 온 교회에서 당회가 내게 사임을 권유했습니다. 아무도 구체적인 이유를 설명해 주지 않았고, 후임 이야기가 이미 오가고 있다는 말도 들렸습니다. 내가 쏟은 시간과 눈물이 아무것도 아니었다는 느낌이 떠나지 않습니다.","q1":"그 말을 들은 날 밤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"서운하고 아프고 눈물도 나요. 그래도 이 교회와 교인들을 향한 사랑이 여전히 남아 있어요.","s":3},{"t":"억울한데, 내가 인정받고 싶어서 그렇게 매달렸나 싶은 생각이 스쳐요.","s":1},{"t":"내가 이 교회에 어떻게 했는데 싶어요. 다시는 이 교회에 손도 대고 싶지 않아요.","s":0},{"t":"당회원들도 이 결정을 하기까지 마음고생이 컸겠다 싶어요. 그분들 사정도 생각해 보고, 서운한 내 마음도 숨기지 않으려고 해요.","s":2}],"q2":"이런 일이 생긴 원인은 무엇이라고 생각하십니까?","o2":["당회 몇 사람이 뒤에서 일을 꾸몄어요.","이 교회는 원래 목회자를 쓰고 버리는 곳이에요.","내가 능력이 모자라거나 헌신이 부족했나 봐요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"아프지만 이 교회에서 받은 사랑과 배운 것이 내 안에 남아 있어요. 떠나는 길도 감사한 마음으로 걸을 수 있을 것 같아요.","s":3},{"t":"당회가 잘못한 것도 같은데 나도 놓친 게 있었을 것 같아요. 그래서 누구 편을 들어야 할지 모르겠어요.","s":1},{"t":"이 교회는 어려운 일이 생기면 한 사람에게 책임을 몰아 왔어요. 그 자리에 선 내가 아팠지만, 책임을 떠넘긴 교인들도 불안했겠구나 싶어요.","s":2}]},{"title":"부흥과 청빙 제의","narr":"몇 년간 기도하고 애쓴 끝에 교회가 눈에 띄게 부흥했습니다. 교인들의 칭찬이 이어지고, 더 큰 교회에서 청빙 제의까지 왔습니다. 이 자리에서 무엇을 쥐고 무엇을 내려놓을지 정해야 합니다.","q1":"청빙 제의를 받은 날 밤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"이 열매 뒤에 지쳐 있던 동역자들 얼굴이 떠올라요. 그분들 애쓴 걸 먼저 알아주고 싶어요.","s":2},{"t":"기쁘긴 한데, 이런 칭찬을 받을 자격이 있나 싶어서 불안해요.","s":1},{"t":"드디어 내 사역이 인정받는구나 싶어요. 이 자리를 누구한테도 뺏기고 싶지 않아요.","s":0},{"t":"기쁘고 감사해서 가슴이 벅차요. 함께한 사람들 얼굴이 하나씩 떠올라요.","s":3}],"q2":"이 부흥은 무엇 덕분이라고 생각하십니까?","o2":["다른 목회자들보다 내가 더 열심히 하고 더 잘 알았기 때문이에요.","교인들이 도와주지 않았어도 내가 혼자 끌고 온 거예요.","그냥 시대가 좋았을 뿐이고 내 몫은 거의 없어요."],"q3":"그렇다면 이 부흥에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"교회가 자랄 때 마을에 젊은 가정이 많이 들어왔고, 앞서 섬긴 분들의 기도가 쌓여 있었어요. 내 공만 말할 수는 없고, 그분들 수고도 같이 기억하고 싶어요.","s":2},{"t":"이 열매는 많은 사람의 눈물과 기도로 맺힌 거예요. 어느 자리에 있든 그 사람들과 이어져 있다는 평안이 있어요.","s":3},{"t":"내가 애쓴 것도 있고 도와준 사람도 있는데, 내 몫이 얼마인지 말하려면 말문이 막혀요.","s":1}]},{"title":"기도의 침묵","narr":"새벽마다 기도해도 응답은 없고, 사역은 해마다 줄어드는 느낌입니다. 함께 시작한 동역자들은 하나둘 떠납니다. 내가 서 있는 자리의 의미가 흔들립니다.","q1":"아무도 없는 예배당에서, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"다 소용없다 싶어요. 떠난 사람들도, 나를 이렇게 만든 상황도 원망스러워요.","s":0},{"t":"이 침묵 속에 있으니까 내가 피해 온 마음들이 하나씩 올라와요. 그걸 마주하고 있어요.","s":1},{"t":"응답이 없어서 쓸쓸해요. 그래도 하나님이 곁에 계시다는 따뜻함은 마음 한쪽에 남아 있어요.","s":3},{"t":"기도해도 대답이 없는 동안 나도 참 많이 지쳤구나 싶어요. 그 마음을 숨기지 않고 하나님께 그대로 말씀드리고 있어요.","s":2}],"q2":"이런 상황의 원인은 무엇이라고 생각하십니까?","o2":["함께 시작한 동역자들이 끈기가 없었어요.","시대가 달라져서 이런 목회는 이제 통하지 않아요.","내 믿음이 부족해서 이런 일이 생겼어요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"동역자들 탓인지, 시대 탓인지, 내 믿음 탓인지 기도할 때마다 생각이 바뀌어서 갈피를 못 잡겠어요.","s":1},{"t":"떠난 동역자들도 나름대로 사정이 있고 지쳤을 거예요. 그 마음을 생각하게 되고, 나 혼자 졌던 짐을 나눠 질 사람도 찾고 싶어요.","s":2},{"t":"이 침묵이 외롭긴 해도 낯설지는 않아요. 떠난 동역자들 위해서도 기도하게 되고, 기도하고 나면 마음이 가라앉아요.","s":3}]}];
var ST4=[{"name":"흑화(Nigredo)","basic":"연금술적 변형의 첫 번째 관문인 '흑화(Nigredo)'는 자아가 구축해 온 기존의 세계관과 정체성이 완전히 해체되고 깊은 내적 어둠과 자아 상실을 경험하는 단계입니다. '흑화(Nigredo)'는 물질이 불에 타거나 분해되면서 검게 변하는 단계로, 이전과 같은 방식으로는 더 이상 유지될 수 없는 상태에 이릅니다.\n분석심리학적 관점에서 흑화는 자아(Ego)가 세속적 성취, 사회적 페르소나, 그리고 현실 세계와의 맹목적 동일시에서 강제로 분리되는 실존적 상황을 경험하게 되는 단계입니다. 사람의 마음으로 옮겨 보면, 믿고 의지하던 가치나 관계, 자신에 대한 확신이 흔들리면서 내면의 어둠과 마주하는 시기에 해당합니다. 이때는 분노와 억울함, 두려움과 자책 같은 감정이 크게 올라올 수 있습니다. 상황을 이해하려는 마음보다 누가 잘못했는지를 가리려는 마음이 앞서고, 복잡한 문제의 원인을 특정한 사람이나 자신의 잘못 한 가지로 돌리기도 합니다.\n흑화의 과정에서 고통과 어둠과 붕괴는 필연이지만, 핵심은 단순히 고통을 겪는 데 있지 않습니다. 그동안 당연하게 여겼던 해석과 대응 방식이 이제는 더 이상 충분하지 않다는 사실이 드러나는 데 있습니다. 그것은 기존의 낡은 세계를 떠나 신성한 순례를 시작하는 '문(Door)'을 상징합니다.","short":"흑화","title":"무너짐과 내려놓음","desc":"일이 터졌을 때 원인을 한 곳에 고정해야 마음이 버텨지는 자리입니다. 원인을 교인이나 당회, 제도 같은 바깥에 두기도 하고, 내 부족함이라는 안쪽에 두기도 하는데, 방향만 다를 뿐 한곳에 묶어 두는 방식은 같습니다. 분노와 자책이 함께 오가는 것도 이 자리의 특징입니다.","past":"목회 현장에서는 교인이나 직분자를 향한 냉소, 설교와 심방이 의무로만 느껴지는 소진, 사임이나 떠남에 대한 충동으로 나타나기 쉽습니다. 몸이 먼저 신호를 보내서 잠을 못 자거나 긴장이 풀리지 않기도 합니다.","power":"붙들고 있는 힘이 그만큼 깊이 사랑하고 애써 왔다는 증거입니다. 분노와 아픔은 이 일이 내게 소중했다는 신호이기도 합니다. 이 자리에 선 목회자는 포기하지 않고 끝까지 버텨 온 사람입니다.","test":"원인을 한 곳에 두고 있는 동안에는 사임, 폭로, 관계 단절 같은 큰 결정이 가깝게 느껴집니다. 지금의 판단이 일이 가라앉은 뒤에도 같을지 스스로 물어보십시오.","next":"큰 결정은 미루고, 믿을 수 있는 한 사람에게 일어난 일을 있는 그대로 말하십시오. 잠과 쉼을 먼저 회복하고, 누구의 잘못인지 판단하는 일은 마음이 가라앉은 뒤로 두십시오."},{"name":"백화(Albedo)","basic":"연금술에서 백화는 검게 변한 물질이 정화 과정을 거치며 희게 되는 단계입니다. 흑화의 혼돈 속에서 해체된 자아가 무의식의 깊은 수로로 진입하여 정화와 세척을 거치는 과정입니다. 마음에서는 감정의 소용돌이가 조금씩 가라앉고, 자신과 상황을 한 걸음 떨어져 바라보기 시작하는 시기에 해당합니다. 이전에는 상대의 잘못만 보였다면 이제는 자신의 반응과 선택도 돌아보게 됩니다. 그렇다고 해서 모든 책임이 자신에게 있다는 뜻은 아닙니다. 중요한 변화는 문제를 한쪽의 잘못만으로 설명하던 시각에서 벗어나기 시작한다는 데 있습니다.\n다만 이 시기에는 상대의 책임과 자신의 책임, 상대를 이해하는 일과 자신의 상처를 인정하는 일이 아직 충분히 구분되지 않을 수 있습니다. 이해하려는 마음이 자칫 자신의 몫을 넘어 상대의 책임까지 떠안는 태도로 이어질 수도 있습니다. 무엇보다 백화는 무의식 속에 억압되어 있던 그림자(Shadow)를 직면하고 해석함으로써 내면의 정동을 정화하고 존재의 재구성을 준비하는 전략적 전환점입니다. 그러므로 백화는 무조건 누구의 탓을 찾는 단계가 아니라, 감정과 사실을 구별하고 각자의 몫을 살펴보기 시작하는 단계입니다.","short":"백화","title":"씻김과 직면","desc":"억울함 속에서도 내 몫을 돌아보기 시작한 자리입니다. 정직한 용기가 있어야 여기까지 옵니다. 마음이 오락가락하는 것은 정직해지고 있다는 표시입니다.","past":"목회 현장에서는 교인을 원망하다가 내 목회 방식을 돌아보고, 돌아보다가 자책에 빠졌다가 다시 억울해지는 흐름으로 나타납니다. 설교에서 내 이야기를 정직하게 꺼내고 싶어지는 때도 이 자리입니다.","power":"상대를 원망하는 데 머물지 않고 자기 안을 들여다보는 힘이 자라고 있습니다. 이 힘이 있는 분은 다음 자리로 건너가게 됩니다.","test":"지금의 혼란은 앞으로 가고 있다는 표시입니다. 서두르지 않으셔도 됩니다.","testTitle":"격려의 말씀","next":"오늘 마음에 걸리는 일 하나를 종이에 적고, 사실과 내 생각을 나누어 보십시오. 한 줄이면 충분합니다."},{"name":"황화(Citrinitas)","basic":"연금술의 황화는 물질이 노란빛을 띠는 단계입니다. 분석심리학적으로 황화는 인격의 중심축이 이기적이고 파편화된 '자아(Ego)'에서 본질적이고 통합적인 '자기(Self)'로 근본적으로 이동하는 내적 인식의 대전환을 의미합니다.\n마음에서는 이전에 뒤섞여 있던 감정과 책임이 조금씩 분별되기 시작합니다. 상대의 사정을 이해하면서도 그 사람의 몫을 대신 짊어지지 않고, 자신의 잘못을 인정하면서도 모든 문제를 자신의 탓으로 돌리지 않게 됩니다. 이해와 동의가 다르다는 사실도 분명해집니다. 상대를 이해한다고 해서 상대의 행동을 정당화할 필요는 없으며, 자신의 상처를 인정한다고 해서 반드시 상대를 정죄해야 하는 것도 아닙니다. 이처럼 황화에서는 흑화의 고통과 백화의 성찰을 거치며 얻은 인식이 하나의 분별력으로 자리 잡기 시작합니다. 다만 무엇이 옳은지 알아차리는 것과 그에 맞게 살아가는 것은 별개의 일입니다. 황화는 통찰이 밝아지는 단계이며, 그 통찰을 일상의 선택과 관계 속에서 지속적으로 실천하는 과제는 여전히 남아 있습니다.","short":"황화","title":"인격이 익어 가는 자리","desc":"교회 안에서 일어난 일을 한 사람의 잘못으로 몰지 않고, 상처 입은 사람들과 나를 함께 품을 수 있는 자리입니다. 아픔을 피하지 않고 지나온 시간이 있었기에 여기까지 오셨습니다. 충분히 칭찬받을 만한 성숙입니다.","past":"목회 현장에서는 갈등이 생기면 누가 아팠는지를 먼저 보게 되고, 교인들이 그 변화를 느끼기 시작합니다. 선생님의 말에 무게가 실리고, 사람들이 안심하고 곁에 머뭅니다.","power":"사람을 미워하지 않으면서 해야 할 말은 하실 수 있습니다. 이해가 깊어서 상대가 방어하지 않고 듣게 되고, 그것이 교회 안에서 갈등을 풀어 가는 힘이 됩니다. 믿음이 감정에 흔들리지 않고 중심을 잡고 있다는 뜻입니다.","test":"지금 보고 계신 것을 믿으셔도 됩니다. 이 통찰은 이미 선생님 안에 뿌리를 내렸습니다. 기도와 말씀 안에서 사람을 대하는 지금의 방식을 꾸준히 이어 가시면 충분합니다.","testTitle":"믿음을 굳게 하는 길","next":"이미 하고 계신 일 가운데 가장 잘 되는 한 가지를 떠올려 보십시오. 그 방식이 선생님의 중심입니다. 후배나 동료가 힘들어할 때 그 방식으로 곁에 서 주시면, 선생님의 통찰이 다른 사람의 길도 밝혀 줍니다."},{"name":"적화(Rubedo)","basic":"연금술에서 적화는 물질이 붉은빛을 띠며 변형의 완성에 이르는 단계로 설명되며, '적화(Rubedo)'는 자아(Ego)와 무의식이 완전한 조화를 이루어 자기(Self)를 완벽히 실현하는 단계입니다. 마음에서는 앞선 과정에서 얻은 통찰이 생각에 머물지 않고 실제 삶의 태도와 관계 속에 드러나기 시작합니다. 자신과 타인의 한계를 인정하면서도 관계를 포기하지 않고, 사랑을 실천하면서도 자신을 잃지 않는 방향을 배워 갑니다. 과거의 상처를 없었던 일로 만들거나 모든 경험을 긍정적으로 해석하는 것이 완성은 아닙니다. 오히려 아픔과 기쁨, 실수와 배움이 자신의 삶 안에 함께 놓일 수 있음을 받아들이는 데 가깝습니다.\n신학적으로 적화는 인간 내면에 '하나님의 형상(Imago Dei)'이 회복되는 단계이며, 신적 계시나 영적 통찰을 추상적 관념으로 남겨 두지 않고 개인이 속한 구체적인 삶의 현장과 역사 속에서 사명(Mission)의 형태로 온전히 구현해 내는 데 그 뜻이 있습니다. 통합된 경험은 타인을 함부로 판단하지 않는 태도와 필요한 경계를 세우는 지혜로 이어질 수 있습니다. 자신이 겪은 일을 다른 사람을 돕는 데 활용할 수도 있지만, 그것이 반드시 어떤 역할이나 성과로 나타나야 하는 것은 아닙니다. 적화의 핵심은 고통을 미화하는 데 있지 않고, 그 경험을 통과하며 얻은 이해가 자신의 삶을 살아가는 방식으로 구현되는 데 있습니다.","short":"적화","title":"삶으로 완성되는 자리","desc":"이해가 삶 속으로 스며들어 따로 설명하지 않아도 일상에서 드러나는 자리입니다. 원인을 따지는 일보다 앞으로 맡을 일과 관계에 힘이 쏟아지고, 어려움 속에서도 일상의 리듬이 유지됩니다.","past":"목회 현장에서는 갈등 중에도 예배와 심방의 질이 유지되고, 상대를 대하는 태도가 변하지 않으며, 겪은 일이 설교와 상담에서 자연스러운 자산이 됩니다.","power":"이 일을 겪으며 생긴 아픔과 사랑이 함께 있는 자리입니다. 그 둘을 가르지 않고 안고 있어서, 교인들 곁에 서는 것만으로 위로가 됩니다.","test":"이미 건너왔다는 마음이 올라오기 쉽습니다. 아직 길 위에 있는 사람들 곁에서 같은 눈높이를 지켜 주십시오. 새로운 일이 닥쳐 다시 흔들리더라도, 그것은 새 순환이 시작되는 모습입니다.","next":"받은 것이 자연스럽게 흘러갈 자리를 찾아 보십시오. 같은 아픔을 지나는 후배 목회자나 동료 곁에 앉아 주는 것만으로 충분합니다. 이 자리도 다음 순환의 시작입니다."}];
var TR=["건너가는 자리 1","건너가는 자리 2"];
var TRT=["백화에서 황화로 건너가는 자리입니다. 내 몫이 보이기 시작했고 상대의 사정과 아픔도 어렴풋이 헤아려지지만, 마음이 아직 그 이해를 따라오지 못하고 있습니다. 머리로는 알겠는데 마음이 움직이지 않아서 스스로를 답답해하기 쉽습니다. 이해가 마음으로 내려오는 데에는 시간이 필요하니 서두르지 마십시오. 다음 걸음은 깨달은 것을 믿을 만한 한 사람에게 말로 풀어 보는 것입니다. 입으로 말하는 순간 마음이 따라오기 시작합니다.","황화에서 적화로 건너가는 자리입니다. 상대의 아픔과 내 몫이 분명히 헤아려지는데, 그 마음이 일상의 습관과 관계 속에서 아직 자연스러워지지 않았습니다. 아는 만큼 살아 내지 못한다는 아쉬움이 올라오기 쉽습니다. 이 자리의 과제는 아는 것을 작은 습관 하나로 옮기는 일입니다. 이번 주에 바꿀 한 가지를 정하고, 교인들이 그 변화를 어떻게 받아들이는지 지켜보십시오."];
var TRB=["백화에서 황화로 넘어가는 시기는 깨달음이 마음으로 내려오는 때에 해당합니다. 이해는 생기기 시작했지만 마음이 아직 그 속도를 따라가는 중인 특징이 나타납니다.","황화에서 적화로 넘어가는 시기는 아는 것이 삶의 습관으로 옮겨 가는 때에 해당합니다. 이해는 분명한데 그것이 일상에서 아직 자연스러워지지 않은 특징이 나타납니다."];
var INTRO="인간의 성품과 인격과 신앙이 변화하는 결정적 과정에는 단계가 있습니다.";
var CLOSE="네 단계는 서로 완전히 분리된 상태라기보다 겹치고 되돌아오기도 하는 변화의 과정입니다. 흑화에서 무너진 기존의 해석은 백화에서 재검토되고, 황화에서 새로운 분별력을 얻으며, 적화에서 삶의 태도로 구체화됩니다. 그러나 통찰을 얻었다고 해서 언제나 그에 맞게 행동할 수 있는 것은 아닙니다. 익숙한 감정과 대응 방식이 다시 나타날 수 있으며, 그때마다 앞선 과정을 되짚게 됩니다.";
var NOTE=[{"m":"자아가 쌓아 온 통제 체계가 무너질 때 원인을 상대, 조직, 환경 또는 자신의 결함 한쪽에 가두는 방어 기제입니다. 투사와 자기 비난은 방향만 다를 뿐 모두 원인을 한 곳에 고정해 해체 불안을 견디려는 역동입니다.","o":"'그 사람 때문에' 혹은 '내가 부족해서'라는 단정적 언어가 반복되는지 봅니다. 불면과 긴장 같은 신체 반응, 냉소와 소진, 사임이나 폭로 같은 충동적 결정을 앞두고 있는지도 확인합니다.","c":"큰 결정이 임박했다면 결정 시점을 늦추도록 돕고, 안전하게 사실을 말할 사람이 있는지 확인합니다."},{"m":"투사를 거두기 시작해 내 몫을 인식하지만, 상대의 몫과 내 몫이 아직 구분되지 않고 뭉뚱그려진 상태입니다. 감정 정화와 그림자 인식이 시작되었으나 구조화되지는 않았습니다.","o":"'둘 다 있는 것 같은데 모르겠다'는 말이 잦은지, 억울함과 자기 점검 사이에서 감정이 오가는지 살핍니다. 자책으로 기우는 순간이 있는지 확인합니다.","c":"서두르지 않도록 돕고, 사실과 해석을 나누어 적는 작업이 효과적입니다."},{"m":"사건 속 사람들의 아픔과 사정을 헤아리며 각자의 몫을 가려 보는 지혜의 단계입니다. 자아 중심에서 더 큰 맥락으로 시선이 옮겨 가며 감정이 가라앉고 인격화가 시작됩니다.","o":"상대의 아픔을 먼저 말하는지, 정죄가 줄고 돌봄의 말과 구체적인 선택이 나오는지 확인합니다. 분석만 앞서고 마음이 따라오지 않는 이성화는 아닌지도 살핍니다.","c":"이해만으로 충분하다고 느끼는 지점에서 실천 과제를 하나 제안합니다."},{"m":"이해가 삶으로 통합되어 따로 설명할 필요가 없어진 상태입니다. 원인 분석보다 이후의 삶의 방향이 관심의 중심이 되고, 일상의 평정과 나눔으로 드러납니다.","o":"일상의 리듬을 유지하는지, 사건을 삶의 한 부분으로 담담히 말하는지, 다음 여정에 열려 있는지 봅니다. 감정을 눌러 두는 회피와 구별하기 위해 신체 반응과 표정도 함께 살핍니다.","c":"적화로 읽혀도 피로와 감정의 폭발이 있다면 회피일 수 있으니, 구체적인 행동 답이 실제로 이루어지고 있는지 물어봅니다."}];
function analyze(ans,SC){
 var cnt=[0,0,0,0],mm=[0,0,0],mmT=0,rows=[];
 for(var n=1;n<=SC.length;n++){
  var a=ans[n]||[0,0,0],sc=SC[n-1];
  var f=a[0]?sc.o1[a[0]-1].s:-1;
  var t=a[1]?(a[1]<=3?0:(a[2]?sc.o3[a[2]-1].s:-1)):-1;
  if(f>=0)cnt[f]++;if(t>=0)cnt[t]++;
  if(f>=0&&t>=0&&Math.abs(f-t)==1){mm[Math.min(f,t)]++;mmT++;}
  rows.push({f:f,t:t});
 }
 var tc=[0,0,0,0];rows.forEach(function(r){if(r.t>=0)tc[r.t]++;});
 var p=0;for(var i=1;i<4;i++){if(cnt[i]>cnt[p]||(cnt[i]==cnt[p]&&tc[i]>tc[p]))p=i;}
 var best=0;for(i=1;i<3;i++)if(mm[i]>mm[best])best=i;
 var tr=(mmT>=4&&(best==1||best==2))?best-1:-1;
 return {cnt:cnt,p:p,tr:tr,rows:rows,tc:tc};
}
function posName(r,ST4,TR){return r.tr>=0?TR[r.tr]:ST4[r.p].short;}

var CIR=["①","②","③","④"];
var API_URL="https://script.google.com/macros/s/AKfycbxiNFo2DLekHyiD9JPFVG1mfkkTkyKR1K75pGato8Jrv1dj0305csdLnJMV95Wb6tPX/exec";
var KEY="life34_v2";
var CODE="",NAME="";
try{CODE=localStorage.getItem("life34_code")||"";NAME=localStorage.getItem("life34_name")||"";}catch(e){}
var ans={},step=0;
try{ans=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){ans={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ans));}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var app=document.getElementById("app");

function intro(){
 var has=Object.keys(ans).length>0;
 var h='<h1>내 삶의 위치를 알아볼 수 있는 질문</h1><hr class="rule">'+
  '<p>일곱 장면이 차례로 나옵니다. 장면마다 지금의 나와 가장 가까운 답을 하나씩 골라 주세요. 정답은 없습니다. 답에 따라 다음 질문이 달라질 수 있고, 10분 정도 걸립니다.</p>';
 if(API_URL){
  h+='<p class="note">인도자에게 받은 접속번호를 입력해 주세요.</p>'+
   '<p><input id="code" inputmode="numeric" autocomplete="off" placeholder="접속번호" value="'+esc(CODE)+'" style="font:inherit;padding:.6em .8em;width:12em;border:1px solid #cfc6b0"></p>'+
   '<p id="cmsg" class="note"></p>';
 }else{
  h+='<p class="note">답은 이 기기 안에만 저장되며 어디로도 전송되지 않습니다.</p>';
 }
 h+='<div class="nav"><span></span><button id="go">'+(has?'이어서 하기':'시작하기')+'</button></div>'+
  (has?'<p class="note"><a href="#" id="reset">처음부터 다시 하기</a></p>':'');
 app.innerHTML=h;
 document.getElementById("go").onclick=function(){
  if(!API_URL){step=0;page();return;}
  var c=document.getElementById("code").value.replace(/\s/g,"");
  var m=document.getElementById("cmsg");
  if(!c){m.textContent="접속번호를 입력해 주세요.";return;}
  m.textContent="확인 중입니다...";
  fetch(API_URL+"?action=check&code="+encodeURIComponent(c)).then(function(r){return r.json();}).then(function(j){
   if(!j.ok){m.textContent="접속번호를 찾을 수 없습니다. 다시 확인해 주세요.";return;}
   CODE=c;NAME=j.name||"";
   try{localStorage.setItem("life34_code",CODE);localStorage.setItem("life34_name",NAME);}catch(e){}
   step=0;page();
  }).catch(function(){m.textContent="연결에 실패했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.";});
 };
 var r=document.getElementById("reset");
 if(r)r.onclick=function(e){e.preventDefault();ans={};save();intro();};
}
function encode(){
 var a="";
 for(var n=1;n<=SC.length;n++){var v=ans[n]||[0,0,0];a+=(v[0]||0)+""+(v[1]||0)+""+(v[2]||0);}
 return a;
}
function sendResult(pos){
 var m=document.getElementById("sendmsg");if(!m)return;
 m.textContent="응답을 전달하는 중입니다...";
 fetch(API_URL+"?action=save&code="+encodeURIComponent(CODE)+"&a="+encode()+"&pos="+encodeURIComponent(pos)).then(function(r){return r.json();}).then(function(j){
  m.textContent=j.ok?"응답이 인도자에게 전달되었습니다.":"전달하지 못했습니다. 접속번호를 확인해 주세요.";
 }).catch(function(){
  m.innerHTML='전달하지 못했습니다. 인터넷 연결을 확인하고 <a href="#" id="retry">다시 보내기</a>를 눌러 주세요.';
  var t=document.getElementById("retry");if(t)t.onclick=function(e){e.preventDefault();sendResult(pos);};
 });
}
function opts(name,list,cur,textOf){
 var h="";
 for(var v=0;v<list.length;v++){
  h+='<label class="opt"><input type="radio" name="'+name+'" value="'+(v+1)+'"'+(cur==v+1?' checked':'')+'>'+CIR[v]+' '+esc(textOf(list[v]))+'</label>';
 }
 return h;
}
function page(){
 var n=step+1,sc=SC[step],a=ans[n]||[0,0,0],h='';
 h+='<div class="bar"><i style="width:'+Math.round(step/SC.length*100)+'%"></i></div>';
 h+='<p class="stagehead">장면 '+n+' / '+SC.length+'</p>';
 h+='<div class="nar"><p>'+esc(sc.narr)+'</p></div>';
 h+='<div class="q"><p class="t">'+esc(sc.q1)+'</p>'+opts("a1",sc.o1,a[0],function(o){return o.t;})+'</div>';
 var o2=sc.o2.concat(["해당 항목 없음"]);
 h+='<div class="q"><p class="t">'+esc(sc.q2)+'</p>'+opts("a2",o2,a[1],function(o){return o;})+'</div>';
 h+='<div class="q'+(a[1]==4?'':' hidden')+'" id="q3box"><p class="t">'+esc(sc.q3)+'</p>'+opts("a3",sc.o3,a[2],function(o){return o.t;})+'</div>';
 h+='<p id="warn" class="note hidden">답하지 않은 질문이 있습니다.</p>';
 h+='<div class="nav"><button class="ghost" id="back">이전</button><button id="next">'+(step==SC.length-1?'결과 보기':'다음')+'</button></div>';
 app.innerHTML=h;
 var radios=app.querySelectorAll("input[type=radio]");
 for(var i=0;i<radios.length;i++)radios[i].onchange=function(){
  var v=ans[n]||[0,0,0];var val=parseInt(this.value);
  if(this.name=="a1")v[0]=val;
  if(this.name=="a2"){v[1]=val;if(val!=4){v[2]=0;var r3=document.getElementsByName("a3");for(var k=0;k<r3.length;k++)r3[k].checked=false;}document.getElementById("q3box").className="q"+(val==4?"":" hidden");}
  if(this.name=="a3")v[2]=val;
  ans[n]=v;save();document.getElementById("warn").className="note hidden";
 };
 document.getElementById("back").onclick=function(){if(step==0)intro();else{step--;page();window.scrollTo(0,0);}};
 document.getElementById("next").onclick=function(){
  var v=ans[n]||[0,0,0];
  if(!v[0]||!v[1]||(v[1]==4&&!v[2])){document.getElementById("warn").className="note";return;}
  if(step==SC.length-1)result();else{step++;page();window.scrollTo(0,0);}
 };
}
function paras(s){return s.split('\n').map(function(t){return '<p>'+t+'</p>';}).join('');}
function result(){
 var R=analyze(ans,SC),total=SC.length*2;
 var h='<h1>'+(NAME?esc(NAME)+' 님의 지금 위치':'나의 지금 위치')+'</h1><hr class="rule">';
 h+='<div class="pos"><p style="margin:0">';
 if(R.tr>=0)h+='당신은 지금 <b>'+ST4[R.tr+1].short+'</b>와 <b>'+ST4[R.tr+2].short+'</b> 사이, 건너가는 자리에 있습니다.';
 else h+='당신은 지금 <b>'+ST4[R.p].name+'</b>의 자리에 있습니다.';
 h+='</p></div>';
 if(R.tr>=0){
  h+='<h3>'+ST4[R.tr+1].short+'란</h3>'+paras(ST4[R.tr+1].basic);
  h+='<h3>'+ST4[R.tr+2].short+'란</h3>'+paras(ST4[R.tr+2].basic);
  h+='<h3>건너가는 자리란</h3><p>'+TRB[R.tr]+'</p>';
 }else{
  h+='<h3>'+ST4[R.p].short+'란</h3>'+paras(ST4[R.p].basic);
 }
 h+='<details><summary style="cursor:pointer;color:#1f7e79;margin:1em 0">네 단계 전체 설명 보기</summary><p>'+INTRO+' 이 질문지는 그 과정을 연금술의 네 단계에 빗대어 살핍니다. 이 결과는 높고 낮음을 가리는 점수가 아니라 지금 걷고 있는 길의 위치를 알려 주는 표시이며, 시간이 지나 다시 해 보면 달라질 수 있습니다.</p>';
 for(var q=0;q<4;q++)h+='<h4 style="margin:1.2em 0 .2em;color:#1a2b4a">'+(q+1)+'단계 '+ST4[q].name+'</h4>'+paras(ST4[q].basic);
 h+='<p>'+CLOSE+'</p></details>';
  if(R.tr>=0){
  h+='<h3>이 건너감의 모습</h3><p>'+TRT[R.tr]+'</p>';
 }else{
  var S=ST4[R.p];
  h+='<h3>이 자리의 모습</h3><p>'+S.desc+'</p><p>'+S.past+'</p>';
  h+='<h3>이 자리의 힘</h3><p>'+S.power+'</p>';
  h+='<h3>'+(S.testTitle||'이 자리의 시험')+'</h3><p>'+S.test+'</p>';
  h+='<h3>다음 걸음</h3><p>'+S.next+'</p>';
 }
 var ahead=0,behind=0;
 R.rows.forEach(function(r){if(r.f>=0&&r.t>=0){if(r.t>r.f)ahead++;else if(r.f>r.t)behind++;}});
 h+='<h3>마음과 생각의 간격</h3>';
 var g=[];
 if(ahead>=3)g.push('이해가 깊고 마음이 그 뒤를 천천히 따라오고 있습니다. 슬퍼하고 기뻐할 시간을 충분히 가지셔도 좋습니다.');
 if(behind>=3)g.push('마음의 평안이 설명보다 먼저 와 있다는 것은 믿음이 이미 깊어졌다는 신호입니다. 말로 다 정리되지 않아도 괜찮으니, 그 평안을 그대로 누리십시오.');
 if(!g.length)g.push('마음과 생각이 대체로 같은 자리에 있습니다. 느끼는 것과 이해하는 것이 어긋나지 않는 안정된 모습입니다.');
 h+='<p>'+g.join(' ')+'</p>';
 h+='<h3>장면별로 보면</h3><table style="width:100%;border-collapse:collapse;font-size:.95em"><tr><th style="text-align:left;padding:6px;border-bottom:2px solid #d9cfb4">장면</th><th style="text-align:left;padding:6px;border-bottom:2px solid #d9cfb4">마음</th><th style="text-align:left;padding:6px;border-bottom:2px solid #d9cfb4">생각</th></tr>';
 R.rows.forEach(function(r,i){h+='<tr><td style="padding:6px;border-bottom:1px solid #eee">'+(i+1)+'. '+esc(SC[i].title)+'</td><td style="padding:6px;border-bottom:1px solid #eee">'+(r.f>=0?ST4[r.f].short:'')+'</td><td style="padding:6px;border-bottom:1px solid #eee">'+(r.t>=0?ST4[r.t].short:'')+'</td></tr>';});
 h+='</table><h3>네 자리 한눈에</h3>';
 for(var i=0;i<4;i++){
  var T=ST4[i],on=R.cnt[i]?Math.min(4,Math.ceil(R.cnt[i]/(total/4))):0;
  var isOn=(R.tr>=0)?(i==R.tr+1||i==R.tr+2):(i==R.p);
  h+='<div class="card'+(isOn?' on':'')+'"><h4>'+T.name+'</h4><p class="note" style="margin:0">'+T.title+'</p><div class="meter">';
  for(var k=1;k<=4;k++)h+='<b'+(k<=on?' class="on"':'')+'></b>';
  h+='</div></div>';
 }
 h+=(API_URL&&CODE?'<p id="sendmsg" class="note"></p>':'');
 h+='<div class="nav"><button class="ghost" id="again">처음부터 다시</button><button id="print">저장 또는 인쇄</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById("again").onclick=function(){ans={};save();step=0;intro();};
 document.getElementById("print").onclick=function(){window.print();};
 if(API_URL&&CODE)sendResult(posName(R,ST4,TR));
}
intro();
</script>
</body>
</html>
