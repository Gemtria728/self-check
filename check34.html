<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 삶의 위치를 알아볼 수 있는 질문</title>
<style>
:root{--navy:#1a2b4a;--teal:#1f7e79;--cream:#f6f0e1;--gold:#b8923a;--ink:#222}
*{box-sizing:border-box}
html{font-size:15px;-webkit-text-size-adjust:100%}
@media (max-width:700px) and (orientation:portrait){html{font-size:18px}}
body{margin:0;background:#fbf8f0;color:var(--ink);font-family:"Apple SD Gothic Neo","Apple SD 산돌고딕 Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.85}
main{max-width:44rem;margin:0 auto;padding:1.4rem 14px 4rem}
p{margin:.7em 0;text-align:justify;word-break:keep-all;overflow-wrap:break-word}
h1{font-size:1.9em;line-height:1.35;color:var(--navy);margin:.3em 0 .4em}
h3{font-size:1.15em;color:var(--teal);margin:1.6em 0 .3em}
.rule{border:0;border-top:2px solid var(--gold);margin:.8em 0 1.2em}
.bar{height:8px;background:#e6dfcc;border-radius:4px;margin:0 0 1.2em;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.stagehead{color:var(--teal);margin:0 0 1em}
.nar{background:var(--cream);border-left:5px solid var(--gold);padding:12px 16px;margin:0 0 16px}
.nar p{margin:0}
.q{background:#fff;border:1px solid #d9cfb4;border-left:5px solid var(--teal);padding:14px 16px;margin:0 0 16px}
.q .t{margin:0 0 .6em;font-weight:600;color:var(--navy)}
.opt{display:block;margin:6px 0;padding:10px 12px;border:1px solid #cfc6b0;background:#fffdf7;cursor:pointer;line-height:1.6;text-align:justify;word-break:keep-all}
.opt input{margin-right:8px;transform:scale(1.2)}
.opt:has(input:checked){background:var(--cream);border-color:var(--teal)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:1.4em}
button{font:inherit;padding:.7em 1.2em;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--teal)}
.note{font-size:.9em;color:#555}
.card{background:#fff;border:1px solid #d9cfb4;padding:14px 16px;margin:0 0 14px}
.card.on{border-color:var(--gold);border-width:2px}
.card h4{margin:0 0 .3em;color:var(--navy);font-size:1.1em}
.meter{display:flex;gap:4px;margin:.3em 0 .6em}
.meter b{flex:1;height:10px;background:#e6dfcc}
.meter b.on{background:var(--teal)}
.pos{background:var(--cream);border-left:5px solid var(--gold);padding:12px 16px;margin:1em 0}
.hidden{display:none}
@media print{button,.nav,.bar{display:none}body{background:#fff}}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>
<script>
var SC=[{"title":"교인들의 등 돌림","narr":"오랫동안 정성을 다해 돌봐 온 교인들이 중요한 결정의 순간에 나를 등졌습니다. 몇 사람은 뒤에서 나를 흉보고 교회를 떠났습니다. 이것은 서운함의 이야기가 아닙니다. 가장 아끼던 사람이 앞장섰고, 이런 일이 처음이 아니라는 사실이 정말 위기입니다.","q1":"그날 밤 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"마음은 쓰라려도 주일 준비와 심방은 평소처럼 해요. 남은 교인들을 대하는 태도가 달라지지 않게 지키고 있어요.","s":3},{"t":"배신감이 큰데, 그 사람들이 내게 무엇을 기대했는지 내가 한 번이라도 물어봤나 싶어서 마음이 오락가락해요.","s":1},{"t":"내가 어떻게 해 준 사람들인데 싶어요. 누가 앞장섰는지 다 기억나고, 이제 그 사람들에게는 마음을 열기 싫어요.","s":0},{"t":"누구는 왜 떠났고 누구는 왜 남았는지 하나씩 짚어 보게 돼요. 그 가운데 내 몫이 있었는지도 따져 보고 있어요.","s":2}],"q2":"이 일의 원인은 무엇이라고 생각하십니까?","o2":["교인들의 신앙 수준이 거기까지인 거예요.","그 사람들은 원래 자기 이익이 걸리면 돌아서는 사람들이에요.","내가 목회자로서 부족해서 사람들이 떠나는 거예요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"교인들 문제도 있고 내 문제도 있는 것 같은데, 어디까지가 누구 몫인지 뒤섞여서 잘 모르겠어요.","s":1},{"t":"이 교회에는 오래된 관계의 방식이 있었어요. 내가 사람들을 대해 온 방식과 교인들이 기대해 온 방식이 어긋난 지점이 보여요.","s":2},{"t":"이 일은 이 정도로 정리가 됐어요. 앞으로 교인들을 대할 때 바꿀 점이 분명해서, 이미 하나씩 바꾸고 있어요.","s":3}]},{"title":"당회와의 갈등","narr":"교회 재정과 건축 문제로 장로님과 의견이 크게 갈렸습니다. 당회에서 내 의견은 번번이 밀렸고, 몇몇 교인들은 그 장로님 편에 서는 분위기입니다. 목회자로서 내 권위와 자리가 걸린 일입니다.","q1":"당회가 끝난 날 밤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"그 장로님이 교회를 자기 것처럼 쥐고 흔든다는 생각이 떠나지 않아요. 누가 옳은지 교인들 앞에서 가려졌으면 좋겠어요.","s":0},{"t":"분하면서도, 내가 뜻을 꺾이기 싫어서 더 세게 밀어붙인 건 아닌가 하는 생각이 스쳐요.","s":1},{"t":"마음은 무거워도 다음 날 새벽기도와 심방은 평소처럼 해요. 그 장로님도 예배 자리에서는 평소처럼 대해요.","s":3},{"t":"재정 문제, 의사 결정 방식, 서로의 감정을 나누어 보게 돼요. 어디까지 양보하고 어디서는 물러서지 않을지 정리해 보고 있어요.","s":2}],"q2":"이 갈등의 원인은 무엇이라고 생각하십니까?","o2":["그 장로님이 권위욕이 강하고 교회를 자기 뜻대로 하려는 사람이에요.","우리 교회 제도가 원래 목회자를 힘없게 만드는 구조예요.","내가 리더십이 부족하고 사람들을 설득할 줄 몰라서예요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"당회 안건은 미리 나누어 보고 합의할 범위를 먼저 정하기로 했어요. 이번 주 당회부터 그렇게 하고 있어요.","s":3},{"t":"이 교회에는 목회자와 직분자가 힘을 나누어 온 오래된 방식이 있었어요. 이번 일은 그 방식이 한계에 닿은 결과로 보여요.","s":2},{"t":"장로님 문제, 제도 문제, 내 문제가 한꺼번에 섞여 있어서 어디서부터 풀어야 할지 모르겠어요.","s":1}]},{"title":"퍼진 소문","narr":"사실과 다른 소문이 교인들 사이에 퍼졌습니다. 내가 헌금을 사사로이 쓴다는 이야기였고, 해명할 자리도 얻지 못한 채 주일마다 사람들의 눈빛이 달라진 것을 느낍니다. 내 이름과 사역 전체가 걸린 일입니다.","q1":"소문을 들은 지 사흘째, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"소문을 퍼뜨린 사람의 마음과 나의 대응을 따로 놓고 보게 돼요. 무엇을 공개하고 어디서 멈출지 정리하고 있어요.","s":2},{"t":"억울한데, 내가 평소 재정을 투명하게 보여 주지 않아서 의심받을 틈을 준 건 아닌가 하는 마음도 들어요.","s":1},{"t":"마음은 쓰라려도 설교 준비와 심방은 평소처럼 해요. 시간이 지나면 열매가 말해 줄 거라고 생각해요.","s":3},{"t":"누가 퍼뜨렸는지 알아내고 싶어요. 주일에 강단에서 그 사람들을 향해 한마디 하고 싶은 마음이 올라와요.","s":0}],"q2":"이 소문이 퍼진 원인은 무엇이라고 생각하십니까?","o2":["교인 가운데 나를 시기하고 이간질하는 사람이 있어요.","우리 교회는 원래 말이 많고 서로를 의심하는 분위기예요.","내가 평소 처신을 잘못해서 이런 소문이 날 만했어요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"이 교회에는 재정을 둘러싼 오래된 불신이 있었어요. 이번 소문은 그 불신이 드러난 모양이라는 게 보여요.","s":2},{"t":"재정 보고를 매달 교인들에게 공개하기로 했어요. 다음 달 주보부터 싣기로 하고 준비하고 있어요.","s":3},{"t":"그 사람 탓도 있고 내 탓도 있는 것 같은데, 어디까지가 누구 몫인지 흐릿해요.","s":1}]},{"title":"자녀의 방황","narr":"아이가 사춘기에 접어들면서 교회 안팎에서 문제를 일으켰습니다. 목회자 자녀라는 이유로 아이를 보는 교인들의 시선이 더 날카롭고, 아이는 교회에 가기 싫다고 합니다. 부모로서도 목회자로서도 내가 살아온 방식 전체가 흔들립니다.","q1":"아이와 다투고 난 뒤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"아이의 몫과 내 몫을 나누어 보게 돼요. 아이에게 먼저 무엇을 물어볼지 정리하고 있어요.","s":2},{"t":"아이를 탓하다가도, 교회 일로 아이에게 시간을 못 준 내 모습이 떠올라서 마음이 복잡해요.","s":1},{"t":"걱정은 되지만 저녁에는 아이와 식탁에 평소처럼 마주 앉아요. 교회 일은 잠시 내려놓아요.","s":3},{"t":"아이에게 화가 치밀어요. 목회자 자녀가 이래서 되겠느냐는 시선이 제일 신경 쓰여요.","s":0}],"q2":"아이가 이렇게 된 원인은 무엇이라고 생각하십니까?","o2":["교인들이 목회자 자녀를 너무 감시해서 아이가 삐뚤어졌어요.","아이가 타고나기를 고집이 세고 말을 안 듣는 아이예요.","나는 목회자로서도 부모로서도 자격이 없어요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"교회 환경 문제, 아이 문제, 내 문제가 한 덩어리로 섞여 있어서 어디서부터 풀어야 할지 모르겠어요.","s":1},{"t":"우리 가정에는 교회 일이 늘 먼저가 되는 오래된 방식이 있었어요. 아이의 행동이 그걸 비춰 주는 것 같아요.","s":2},{"t":"일주일에 하루는 교회 연락을 끄고 아이와 보내기로 했어요. 지난주부터 지키고 있어요.","s":3}]},{"title":"사임 권유","narr":"수년 동안 헌신해 온 교회에서 당회가 내게 사임을 권유했습니다. 아무도 구체적인 이유를 설명해 주지 않았고, 후임 이야기가 이미 오가고 있다는 말도 들렸습니다. 내가 쏟은 시간과 눈물이 아무것도 아니었다는 느낌이 떠나지 않습니다.","q1":"그 말을 들은 날 밤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"서운함은 있어요. 그래도 남은 기간 맡은 예배와 심방을 평소처럼 하고, 인수인계를 차분히 준비해요.","s":3},{"t":"억울하면서도, 내가 인정받고 싶어서 그렇게 매달렸던 건 아닌가 하는 생각이 스쳐 가요.","s":1},{"t":"내가 이 교회를 위해 얼마나 했는데 싶어요. 다시는 이 교회에 손대고 싶지 않아요.","s":0},{"t":"내가 해 온 사역의 의미와 인정받고 싶은 마음을 따로 떼어서 보게 돼요.","s":2}],"q2":"이런 일이 생긴 원인은 무엇이라고 생각하십니까?","o2":["당회 몇 사람이 뒤에서 일을 꾸몄어요.","이 교회는 원래 목회자를 쓰고 버리는 곳이에요.","내가 능력이 모자라거나 헌신이 부족했나 봐요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"사임 뒤의 생활과 다음 사역을 위해 할 일을 목록으로 정했어요. 하나씩 해 나가고 있어요.","s":3},{"t":"당회 탓도 있고 내 탓도 있는 것 같은데, 어디까지가 어느 쪽 몫인지 잘 모르겠어요.","s":1},{"t":"이 교회에는 목회자를 대해 온 오래된 방식이 있었어요. 내가 그 안에서 맡아 온 자리도 이제 보여요.","s":2}]},{"title":"부흥과 청빙 제의","narr":"몇 년간 기도하고 애쓴 끝에 교회가 눈에 띄게 부흥했습니다. 교인들의 칭찬이 이어지고, 더 큰 교회에서 청빙 제의까지 왔습니다. 이 자리에서 무엇을 쥐고 무엇을 내려놓을지 정해야 합니다.","q1":"청빙 제의를 받은 날 밤, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"이 열매가 어디서 왔는지 돌아보고, 함께한 사람들과 어떻게 나눌지 생각해요.","s":2},{"t":"기쁘면서도, 이 칭찬을 받을 자격이 정말 있나 싶어서 불안해요.","s":1},{"t":"드디어 내 사역이 인정받는구나 싶어요. 이 자리를 누구에게도 빼앗기고 싶지 않아요.","s":0},{"t":"기쁨은 기쁨대로 두고, 다음 날 새벽기도와 심방은 평소처럼 해요.","s":3}],"q2":"이 부흥은 무엇 덕분이라고 생각하십니까?","o2":["다른 목회자들보다 내가 더 열심히 하고 더 잘 알았기 때문이에요.","교인들이 도와주지 않았어도 내가 혼자 끌고 온 거예요.","그냥 시대가 좋았을 뿐이고 내 몫은 거의 없어요."],"q3":"그렇다면 이 부흥에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"이 열매는 앞서 섬긴 분들과 교인들의 헌신이 쌓여서 맺힌 거라는 걸 알아요. 내 몫과 다른 사람들 몫이 각각 보여요.","s":2},{"t":"청빙 여부를 정하기 전에 함께 일한 동역자들과 먼저 의논하기로 했어요. 이미 한 분씩 만나고 있어요.","s":3},{"t":"내 노력도 있고 교인들의 헌신도 있었는데, 어디까지가 내 몫인지 딱 잘라 말하기가 어려워요.","s":1}]},{"title":"기도의 침묵","narr":"새벽마다 기도해도 응답은 없고, 사역은 해마다 줄어드는 느낌입니다. 함께 시작한 동역자들은 하나둘 떠납니다. 내가 서 있는 자리의 의미가 흔들립니다.","q1":"아무도 없는 예배당에서, 내 마음을 가장 잘 나타내는 것은 무엇입니까?","o1":[{"t":"다 소용없다 싶어요. 떠난 사람들과 나를 이렇게 만든 상황이 원망스러워요.","s":0},{"t":"이 침묵 속에서 내가 그동안 피해 온 마음이 올라와요. 그걸 마주하고 있어요.","s":1},{"t":"기도는 이어 가고, 하던 심방과 설교 준비를 하면서 하루를 보내요.","s":3},{"t":"응답이 없는 이 시간이 내게 무엇을 가르치려는지 조용히 묻게 돼요.","s":2}],"q2":"이런 상황의 원인은 무엇이라고 생각하십니까?","o2":["함께 시작한 동역자들이 끈기가 없었어요.","시대가 달라져서 이런 목회는 이제 통하지 않아요.","내 믿음이 부족해서 이런 일이 생겼어요."],"q3":"그렇다면 원인에 가장 가까운 생각은 무엇입니까?","o3":[{"t":"동역자들 문제, 시대 문제, 내 문제가 다 있는 것 같은데 어디서부터 따져야 할지 모르겠어요.","s":1},{"t":"이 사역이 처음 시작된 방식과 내가 이어 온 방식에 오래된 틀이 있었어요. 그게 지금 한계에 닿은 것 같아요.","s":2},{"t":"쉬는 날과 기도 시간을 따로 정하고, 동역자 한 분과 정기적으로 만나기로 했어요. 이번 주부터 하고 있어요.","s":3}]}];
var ST4=[{"name":"흑화(Nigredo)","short":"흑화","title":"무너짐과 내려놓음","desc":"일이 터졌을 때 원인을 한 곳에 고정해야 마음이 버텨지는 자리입니다. 원인을 교인이나 당회, 제도 같은 바깥에 두기도 하고, 내 부족함이라는 안쪽에 두기도 하는데, 방향만 다를 뿐 한곳에 묶어 두는 방식은 같습니다. 분노와 자책이 함께 오가는 것도 이 자리의 특징입니다.","past":"목회 현장에서는 교인이나 직분자를 향한 냉소, 설교와 심방이 의무로만 느껴지는 소진, 사임이나 떠남에 대한 충동으로 나타나기 쉽습니다. 몸이 먼저 신호를 보내서 잠을 못 자거나 긴장이 풀리지 않기도 합니다.","caut":"이 자리의 마음은 약함이 아니라 무너진 것을 붙들려는 힘입니다. 다만 이 상태에서 사임, 폭로, 관계 단절 같은 큰 결정을 내리면 후회가 남기 쉽습니다.","next":"큰 결정은 미루고, 믿을 수 있는 한 사람에게 일어난 일을 있는 그대로 말하는 것이 첫걸음입니다. 잠과 쉼을 먼저 회복하고, 누구의 잘못인지 판단하는 일은 마음이 가라앉은 뒤로 두십시오."},{"name":"백화(Albedo)","short":"백화","title":"씻김과 직면","desc":"원인을 한쪽에 가두던 마음이 풀려서 내 몫도 있겠다는 인식이 생긴 자리입니다. 다만 상대 몫과 내 몫이 아직 분리되지 않고 한 덩어리로 느껴져서, 억울함과 자기 점검 사이를 오가며 마음이 오락가락합니다.","past":"목회 현장에서는 교인을 원망하다가 내 목회 방식을 돌아보고, 돌아보다가 자책에 빠졌다가 다시 억울해지는 흐름으로 나타납니다. 설교에서 내 이야기를 정직하게 꺼내고 싶어지는 때도 이 자리입니다.","caut":"뒤섞인 마음을 빨리 정리하려고 서두르면 모든 것을 내 탓으로 몰아가기 쉽습니다. 이 자리의 혼란은 정직해지는 과정에서 생기는 것입니다.","next":"내 몫과 상대 몫을 종이에 두 칸으로 나누어 적어 보십시오. 무엇이 사실이고 무엇이 내 해석인지 구분하는 일만 해도 한 걸음입니다. 동료 목회자나 상담자와 함께 보면 더 분명해집니다."},{"name":"황화(Citrinitas)","short":"황화","title":"인격이 익어 가는 자리","desc":"일의 구조가 보이는 자리입니다. 누가 어떤 몫을 맡아 왔고 어디서 어긋났는지가 감정과 분리되어 보이고, 상대를 향한 정죄가 줄어듭니다. 내 중심에서 더 큰 맥락으로 시선이 옮겨 갑니다.","past":"목회 현장에서는 교회의 오래된 관계 방식과 직분자들의 역할, 내 목회 방식을 함께 놓고 보며 갈등을 설명할 수 있게 됩니다. 교인들을 가르치려 하기보다 이해하고 듣는 시간이 늘어납니다.","caut":"통찰이 분명해질수록 이해한 것으로 이미 다 되었다고 느끼기 쉽습니다. 이해와 실천 사이에는 시간이 필요합니다.","next":"이해한 것 중 하나를 골라 이번 주 행동으로 옮겨 보십시오. 그 행동이 교인들에게 어떻게 전달되는지 지켜보는 것이 다음 자리로 건너가는 길입니다."},{"name":"적화(Rubedo)","short":"적화","title":"삶으로 완성되는 자리","desc":"이해가 삶 속으로 스며들어 따로 설명하지 않아도 일상에서 드러나는 자리입니다. 원인을 따지는 일보다 앞으로 맡을 일과 관계에 힘이 쏟아지고, 어려움 속에서도 일상의 리듬이 유지됩니다.","past":"목회 현장에서는 갈등 중에도 예배와 심방의 질이 유지되고, 상대를 대하는 태도가 변하지 않으며, 겪은 일이 설교와 상담에서 자연스러운 자산이 됩니다.","caut":"이 자리는 감정을 눌러 두고 아무렇지 않은 척하는 모습과 겉으로 비슷해 보일 수 있습니다. 몸의 피로와 사소한 일에 터지는 감정이 없는지 함께 살펴보십시오.","next":"받은 것을 흘려보내는 일을 계획해 보십시오. 후배 목회자를 만나거나 같은 아픔을 겪는 동료 곁에 서는 일입니다. 이 자리도 새로운 순환의 시작임을 기억하십시오."}];
var TR=["건너가는 자리 1","건너가는 자리 2"];
var TRT=["백화에서 황화로 건너가는 자리입니다. 내 몫이 보이기 시작했고 일의 구조도 어렴풋이 보이지만, 마음이 아직 그 이해를 따라오지 못하고 있습니다. 머리로는 알겠는데 마음이 움직이지 않아서 스스로를 답답해하기 쉽습니다. 이해가 마음으로 내려오는 데에는 시간이 필요하니 서두르지 마십시오. 다음 걸음은 깨달은 것을 믿을 만한 한 사람에게 말로 풀어 보는 것입니다. 입으로 말하는 순간 마음이 따라오기 시작합니다.","황화에서 적화로 건너가는 자리입니다. 일의 구조는 분명히 보이는데, 그 이해가 일상의 습관과 관계 속에서 아직 자연스러워지지 않았습니다. 아는 만큼 살아 내지 못한다는 아쉬움이 올라오기 쉽습니다. 이 자리의 과제는 아는 것을 작은 습관 하나로 옮기는 일입니다. 이번 주에 바꿀 한 가지를 정하고, 교인들이 그 변화를 어떻게 받아들이는지 지켜보십시오."];
var NOTE=[{"m":"자아가 쌓아 온 통제 체계가 무너질 때 원인을 상대, 조직, 환경 또는 자신의 결함 한쪽에 가두는 방어 기제입니다. 투사와 자기 비난은 방향만 다를 뿐 모두 원인을 한 곳에 고정해 해체 불안을 견디려는 역동입니다.","o":"'그 사람 때문에' 혹은 '내가 부족해서'라는 단정적 언어가 반복되는지 봅니다. 불면과 긴장 같은 신체 반응, 냉소와 소진, 사임이나 폭로 같은 충동적 결정을 앞두고 있는지도 확인합니다.","c":"큰 결정이 임박했다면 결정 시점을 늦추도록 돕고, 안전하게 사실을 말할 사람이 있는지 확인합니다."},{"m":"투사를 거두기 시작해 내 몫을 인식하지만, 상대의 몫과 내 몫이 아직 구분되지 않고 뭉뚱그려진 상태입니다. 감정 정화와 그림자 인식이 시작되었으나 구조화되지는 않았습니다.","o":"'둘 다 있는 것 같은데 모르겠다'는 말이 잦은지, 억울함과 자기 점검 사이에서 감정이 오가는지 살핍니다. 자책으로 기우는 순간이 있는지 확인합니다.","c":"서두르지 않도록 돕고, 사실과 해석을 나누어 적는 작업이 효과적입니다."},{"m":"사건의 구조를 알아보고 각자의 몫을 나누어 보는 통찰의 단계입니다. 자아 중심에서 더 큰 맥락으로 시선이 옮겨 가며 감정이 가라앉고 인격화가 시작됩니다.","o":"사건을 오래된 관계 방식과 역할의 맥락으로 설명하는지, 상대를 향한 정죄가 줄고 구체적인 선택이 나오는지 확인합니다.","c":"이해만으로 충분하다고 느끼는 지점에서 실천 과제를 하나 제안합니다."},{"m":"이해가 삶으로 통합되어 따로 설명할 필요가 없어진 상태입니다. 원인 분석보다 이후의 삶의 방향이 관심의 중심이 되고, 일상의 평정과 나눔으로 드러납니다.","o":"일상의 리듬을 유지하는지, 사건을 삶의 한 부분으로 담담히 말하는지, 다음 여정에 열려 있는지 봅니다. 감정을 눌러 두는 회피와 구별하기 위해 신체 반응과 표정도 함께 살핍니다.","c":"적화로 읽혀도 피로와 감정의 폭발이 있다면 회피일 수 있으니, 구체적인 행동 답이 실제로 이루어지고 있는지 물어봅니다."}];
function analyze(ans,SC){
 var cnt=[0,0,0,0],mm=[0,0,0],mmT=0,rows=[];
 for(var n=1;n<=SC.length;n++){
  var a=ans[n]||[0,0,0],sc=SC[n-1];
  var f=a[0]?sc.o1[a[0]-1].s:-1;
  var t=a[1]?(a[1]<=3?0:(a[2]?sc.o3[a[2]-1].s:-1)):-1;
  if(f>=0)cnt[f]++;if(t>=0)cnt[t]++;
  if(f>=0&&t>=0&&Math.abs(f-t)==1){mm[Math.min(f,t)]++;mmT++;}
  rows.push({f:f,t:t});
 }
 var tc=[0,0,0,0];rows.forEach(function(r){if(r.t>=0)tc[r.t]++;});
 var p=0;for(var i=1;i<4;i++){if(cnt[i]>cnt[p]||(cnt[i]==cnt[p]&&tc[i]>tc[p]))p=i;}
 var best=0;for(i=1;i<3;i++)if(mm[i]>mm[best])best=i;
 var tr=(mmT>=4&&(best==1||best==2))?best-1:-1;
 return {cnt:cnt,p:p,tr:tr,rows:rows,tc:tc};
}
function posName(r,ST4,TR){return r.tr>=0?TR[r.tr]:ST4[r.p].short;}

var CIR=["①","②","③","④"];
var API_URL="https://script.google.com/macros/s/AKfycbylm2-TUwWhK_qw1Nic1k6X5l23pgcOe7KoLb4vT83ZxoH2KumujeGhQLArel4HHDbV/exec";
var KEY="life34_v2";
var CODE="",NAME="";
try{CODE=localStorage.getItem("life34_code")||"";NAME=localStorage.getItem("life34_name")||"";}catch(e){}
var ans={},step=0;
try{ans=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){ans={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ans));}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var app=document.getElementById("app");

function intro(){
 var has=Object.keys(ans).length>0;
 var h='<h1>내 삶의 위치를 알아볼 수 있는 질문</h1><hr class="rule">'+
  '<p>일곱 장면이 차례로 나옵니다. 장면마다 지금의 나와 가장 가까운 답을 하나씩 골라 주세요. 정답은 없습니다. 답에 따라 다음 질문이 달라질 수 있고, 10분 정도 걸립니다.</p>';
 if(API_URL){
  h+='<p class="note">인도자에게 받은 접속번호를 입력해 주세요.</p>'+
   '<p><input id="code" inputmode="numeric" autocomplete="off" placeholder="접속번호" value="'+esc(CODE)+'" style="font:inherit;padding:.6em .8em;width:12em;border:1px solid #cfc6b0"></p>'+
   '<p id="cmsg" class="note"></p>';
 }else{
  h+='<p class="note">답은 이 기기 안에만 저장되며 어디로도 전송되지 않습니다.</p>';
 }
 h+='<div class="nav"><span></span><button id="go">'+(has?'이어서 하기':'시작하기')+'</button></div>'+
  (has?'<p class="note"><a href="#" id="reset">처음부터 다시 하기</a></p>':'');
 app.innerHTML=h;
 document.getElementById("go").onclick=function(){
  if(!API_URL){step=0;page();return;}
  var c=document.getElementById("code").value.replace(/\s/g,"");
  var m=document.getElementById("cmsg");
  if(!c){m.textContent="접속번호를 입력해 주세요.";return;}
  m.textContent="확인 중입니다...";
  fetch(API_URL+"?action=check&code="+encodeURIComponent(c)).then(function(r){return r.json();}).then(function(j){
   if(!j.ok){m.textContent="접속번호를 찾을 수 없습니다. 다시 확인해 주세요.";return;}
   CODE=c;NAME=j.name||"";
   try{localStorage.setItem("life34_code",CODE);localStorage.setItem("life34_name",NAME);}catch(e){}
   step=0;page();
  }).catch(function(){m.textContent="연결에 실패했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.";});
 };
 var r=document.getElementById("reset");
 if(r)r.onclick=function(e){e.preventDefault();ans={};save();intro();};
}
function encode(){
 var a="";
 for(var n=1;n<=SC.length;n++){var v=ans[n]||[0,0,0];a+=(v[0]||0)+""+(v[1]||0)+""+(v[2]||0);}
 return a;
}
function sendResult(pos){
 var m=document.getElementById("sendmsg");if(!m)return;
 m.textContent="응답을 전달하는 중입니다...";
 fetch(API_URL+"?action=save&code="+encodeURIComponent(CODE)+"&a="+encode()+"&pos="+encodeURIComponent(pos)).then(function(r){return r.json();}).then(function(j){
  m.textContent=j.ok?"응답이 인도자에게 전달되었습니다.":"전달하지 못했습니다. 접속번호를 확인해 주세요.";
 }).catch(function(){
  m.innerHTML='전달하지 못했습니다. 인터넷 연결을 확인하고 <a href="#" id="retry">다시 보내기</a>를 눌러 주세요.';
  var t=document.getElementById("retry");if(t)t.onclick=function(e){e.preventDefault();sendResult(pos);};
 });
}
function opts(name,list,cur,textOf){
 var h="";
 for(var v=0;v<list.length;v++){
  h+='<label class="opt"><input type="radio" name="'+name+'" value="'+(v+1)+'"'+(cur==v+1?' checked':'')+'>'+CIR[v]+' '+esc(textOf(list[v]))+'</label>';
 }
 return h;
}
function page(){
 var n=step+1,sc=SC[step],a=ans[n]||[0,0,0],h='';
 h+='<div class="bar"><i style="width:'+Math.round(step/SC.length*100)+'%"></i></div>';
 h+='<p class="stagehead">장면 '+n+' / '+SC.length+'</p>';
 h+='<div class="nar"><p>'+esc(sc.narr)+'</p></div>';
 h+='<div class="q"><p class="t">'+esc(sc.q1)+'</p>'+opts("a1",sc.o1,a[0],function(o){return o.t;})+'</div>';
 var o2=sc.o2.concat(["해당 항목 없음"]);
 h+='<div class="q"><p class="t">'+esc(sc.q2)+'</p>'+opts("a2",o2,a[1],function(o){return o;})+'</div>';
 h+='<div class="q'+(a[1]==4?'':' hidden')+'" id="q3box"><p class="t">'+esc(sc.q3)+'</p>'+opts("a3",sc.o3,a[2],function(o){return o.t;})+'</div>';
 h+='<p id="warn" class="note hidden">답하지 않은 질문이 있습니다.</p>';
 h+='<div class="nav"><button class="ghost" id="back">이전</button><button id="next">'+(step==SC.length-1?'결과 보기':'다음')+'</button></div>';
 app.innerHTML=h;
 var radios=app.querySelectorAll("input[type=radio]");
 for(var i=0;i<radios.length;i++)radios[i].onchange=function(){
  var v=ans[n]||[0,0,0];var val=parseInt(this.value);
  if(this.name=="a1")v[0]=val;
  if(this.name=="a2"){v[1]=val;if(val!=4){v[2]=0;var r3=document.getElementsByName("a3");for(var k=0;k<r3.length;k++)r3[k].checked=false;}document.getElementById("q3box").className="q"+(val==4?"":" hidden");}
  if(this.name=="a3")v[2]=val;
  ans[n]=v;save();document.getElementById("warn").className="note hidden";
 };
 document.getElementById("back").onclick=function(){if(step==0)intro();else{step--;page();window.scrollTo(0,0);}};
 document.getElementById("next").onclick=function(){
  var v=ans[n]||[0,0,0];
  if(!v[0]||!v[1]||(v[1]==4&&!v[2])){document.getElementById("warn").className="note";return;}
  if(step==SC.length-1)result();else{step++;page();window.scrollTo(0,0);}
 };
}
function result(){
 var R=analyze(ans,SC),total=SC.length*2;
 var h='<h1>'+(NAME?esc(NAME)+' 님의 지금 위치':'나의 지금 위치')+'</h1><hr class="rule">';
 h+='<div class="pos"><p style="margin:0">';
 if(R.tr>=0)h+='지금은 <b>'+ST4[R.tr+1].short+'</b>와 <b>'+ST4[R.tr+2].short+'</b> 사이, 건너가는 자리를 걷고 계십니다.';
 else h+='가장 뚜렷하게 드러난 자리는 <b>'+ST4[R.p].name+'</b>, 곧 '+ST4[R.p].title+'의 자리입니다.';
 h+='</p></div>';
 if(R.tr>=0){
  h+='<h3>이 건너감의 모습</h3><p>'+TRT[R.tr]+'</p>';
 }else{
  var S=ST4[R.p];
  h+='<h3>이 자리의 모습</h3><p>'+S.desc+'</p><p>'+S.past+'</p>';
  h+='<h3>마음에 두면 좋은 점</h3><p>'+S.caut+'</p>';
  h+='<h3>다음 걸음</h3><p>'+S.next+'</p>';
 }
 var ahead=0,behind=0;
 R.rows.forEach(function(r){if(r.f>=0&&r.t>=0){if(r.t>r.f)ahead++;else if(r.f>r.t)behind++;}});
 h+='<h3>마음과 생각의 간격</h3>';
 var g=[];
 if(ahead>=3)g.push('일곱 장면 가운데 '+ahead+'개에서 생각이 마음보다 앞서 있습니다. 머리로는 일의 구조를 이해했는데 마음이 아직 따라오지 못하는 모습으로, 목회자에게 흔히 나타납니다. 이해한 것을 감정이 받아들일 시간을 허락해 주십시오.');
 if(behind>=3)g.push('일곱 장면 가운데 '+behind+'개에서 마음이 생각보다 앞서 있습니다. 하루는 평온하게 지내고 있지만 일어난 일의 구조는 아직 정리되지 않았다는 뜻입니다. 평온함 아래 눌러 둔 것이 없는지 한 번 살펴보십시오.');
 if(!g.length)g.push('마음과 생각이 대체로 같은 자리에 있습니다. 느끼는 것과 이해하는 것이 어긋나지 않는 안정된 모습입니다.');
 h+='<p>'+g.join(' ')+'</p>';
 h+='<h3>장면별로 보면</h3><table style="width:100%;border-collapse:collapse;font-size:.95em"><tr><th style="text-align:left;padding:6px;border-bottom:2px solid #d9cfb4">장면</th><th style="text-align:left;padding:6px;border-bottom:2px solid #d9cfb4">마음</th><th style="text-align:left;padding:6px;border-bottom:2px solid #d9cfb4">생각</th></tr>';
 R.rows.forEach(function(r,i){h+='<tr><td style="padding:6px;border-bottom:1px solid #eee">'+(i+1)+'. '+esc(SC[i].title)+'</td><td style="padding:6px;border-bottom:1px solid #eee">'+(r.f>=0?ST4[r.f].short:'')+'</td><td style="padding:6px;border-bottom:1px solid #eee">'+(r.t>=0?ST4[r.t].short:'')+'</td></tr>';});
 h+='</table><h3>네 자리 한눈에</h3>';
 for(var i=0;i<4;i++){
  var T=ST4[i],on=R.cnt[i]?Math.min(4,Math.ceil(R.cnt[i]/(total/4))):0;
  var isOn=(R.tr>=0)?(i==R.tr+1||i==R.tr+2):(i==R.p);
  h+='<div class="card'+(isOn?' on':'')+'"><h4>'+T.name+'</h4><p class="note" style="margin:0">'+T.title+'</p><div class="meter">';
  for(var k=1;k<=4;k++)h+='<b'+(k<=on?' class="on"':'')+'></b>';
  h+='</div><p style="margin:.2em 0">'+T.desc+'</p></div>';
 }
 h+=(API_URL&&CODE?'<p id="sendmsg" class="note"></p>':'');
 h+='<div class="nav"><button class="ghost" id="again">처음부터 다시</button><button id="print">저장 또는 인쇄</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById("again").onclick=function(){ans={};save();step=0;intro();};
 document.getElementById("print").onclick=function(){window.print();};
 if(API_URL&&CODE)sendResult(posName(R,ST4,TR));
}
intro();
</script>
</body>
</html>
