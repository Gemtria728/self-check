<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 삶의 위치를 알아볼 수 있는 34가지 질문</title>
<style>
:root{--navy:#1a2b4a;--teal:#1f7e79;--cream:#f6f0e1;--gold:#b8923a;--ink:#222}
*{box-sizing:border-box}
html{font-size:15px;-webkit-text-size-adjust:100%}
@media (max-width:700px) and (orientation:portrait){html{font-size:18px}}
body{margin:0;background:#fbf8f0;color:var(--ink);font-family:"Apple SD Gothic Neo","Apple SD 산돌고딕 Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.85}
main{max-width:44rem;margin:0 auto;padding:1.4rem 14px 4rem}
p{margin:.7em 0;text-align:justify;word-break:keep-all;overflow-wrap:break-word}
h1{font-size:1.9em;line-height:1.35;color:var(--navy);margin:.3em 0 .4em}
h2{font-size:1.4em;line-height:1.4;color:var(--navy);margin:0 0 .2em}
h3{font-size:1.15em;color:var(--teal);margin:1.6em 0 .3em}
.rule{border:0;border-top:2px solid var(--gold);margin:.8em 0 1.2em}
.sub{color:var(--teal);margin:.2em 0 1.2em}
.bar{height:8px;background:#e6dfcc;border-radius:4px;margin:0 0 1.2em;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.stagehead{color:var(--teal);margin:0 0 1em}
.q{background:#fff;border:1px solid #d9cfb4;border-left:5px solid var(--teal);padding:14px 16px;margin:0 0 16px}
.q .t{margin:0 0 .6em;font-weight:600;color:var(--navy)}
.opt{display:block;margin:6px 0;padding:10px 12px;border:1px solid #cfc6b0;background:#fffdf7;cursor:pointer;line-height:1.6}
.opt input{margin-right:8px;transform:scale(1.2)}
.opt:has(input:checked){background:var(--cream);border-color:var(--teal)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:1.4em}
button{font:inherit;padding:.7em 1.2em;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--teal)}
button:disabled{opacity:.4;cursor:default}
.note{font-size:.9em;color:#555}
.card{background:#fff;border:1px solid #d9cfb4;padding:14px 16px;margin:0 0 14px}
.card h4{margin:0 0 .3em;color:var(--navy);font-size:1.1em}
.meter{display:flex;gap:4px;margin:.3em 0 .6em}
.meter b{flex:1;height:10px;background:#e6dfcc}
.meter b.on{background:var(--teal)}
.pos{background:var(--cream);border-left:5px solid var(--gold);padding:12px 16px;margin:1em 0}
.qn{font-size:.92em;margin:.3em 0}
.hidden{display:none}
@media print{button,.nav,.bar{display:none}body{background:#fff}}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>
<script>
var SCALE=["전혀 그렇지 않다","그렇지 않은 편이다","그런 편이다","매우 그렇다"];
var STAGES=[
{n:"1단계",name:"흑화(Nigredo)",title:"무너짐과 내려놓음",q:[1,5],
 can:"무너지는 자리에서 붙들던 것을 내려놓고, 고요 속에서 내면의 소리를 들을 수 있는 힘",
 hint:"붙들고 있던 것이 흔들리는 자리입니다. 이 흔들림은 약함이 아니라 새로 시작하려는 신호일 수 있습니다."},
{n:"2단계",name:"백화(Albedo)",title:"씻김과 직면",q:[6,10],
 can:"남 탓을 거두고 내 안의 그림자를 마주하며, 약한 나를 있는 그대로 품는 힘",
 hint:"상처와 그림자를 하나씩 마주하는 자리입니다. 천천히 가도 괜찮습니다."},
{n:"3단계",name:"건너가는 자리 1",title:"백화에서 황화로, 깨달음이 삶으로 내려오는 자리",q:[11,17],trans:true,
 can:"머리로 안 것을 일상의 습관과 말과 선택으로 옮겨 가는 힘",
 hint:"알게 된 것을 삶으로 옮기는 자리입니다. 이 다리를 건너는 일은 누구에게나 쉽지 않습니다."},
{n:"4단계",name:"황화(Citrinitas)",title:"인격이 익어 가는 자리",q:[18,22],
 can:"삶의 중심이 나에게서 더 큰 뜻으로 옮겨 가고, 은혜로 살아가는 힘",
 hint:"깨달음이 인품으로 익어 가는 자리입니다. 이미 많이 오신 길입니다."},
{n:"5단계",name:"건너가는 자리 2",title:"황화에서 적화로, 세상 속으로 나아가는 자리",q:[23,29],trans:true,
 can:"안락한 깨달음에 머물지 않고 현실 속으로 들어가 작은 실천과 나눔을 시작하는 힘",
 hint:"안에서 익은 것을 세상에 내어놓는 자리입니다. 불완전한 채로 한 걸음 내딛는 것으로 충분합니다."},
{n:"6단계",name:"적화(Rubedo)",title:"삶으로 완성되는 자리",q:[30,34],
 can:"영적 통찰을 일터와 가정과 관계의 일상 속에서 열매로 나누는 힘",
 hint:"일상이 곧 영성이 되는 자리입니다. 이 자리는 끝이 아니라 새로운 순환의 시작입니다."}
];
var Q=[null,
"기존에 나를 정의하던 정체성, 직함, 삶의 시스템이 무너져 내리거나 더 이상 작동하지 않는다고 느낍니까?",
{t:"삶의 지탱점이 무너질 때, 나는 어떻게 반응합니까?",o:["이를 악물고 기존의 내 모습을 지키려고 집착한다","지키고 싶은 마음이 크지만 조금씩 흔들리고 있다","불안하지만 내려놓아야 한다는 것을 알고 있다","불안해도 익숙한 환경을 내려놓고 새로운 여정을 떠날 준비를 한다"]},
"현재 겪고 있는 상실감과 고난이 단순히 '재수 없는 비극'이 아니라, 삶이 새롭게 태어나기 위해 거쳐야 하는 해체의 과정일 수 있음을 받아들일 수 있습니까?",
"내 힘과 통제력으로는 현재의 상황을 해결할 수 없다는 인간적 한계를 스스로 인정하고 손을 놓을 수 있습니까?",
"외부의 모든 소음이 꺼진 영혼의 어둠 속에서, 들려오는 내면의 진실한 소리에 귀를 기울이고 있습니까?",
"나의 불행과 상처의 원인을 타인이나 환경 탓으로 돌리던 투사를 거두어들이고, 내 안의 '그림자(Shadow)'를 직접 직면하고 있습니까?",
"과거의 억울했던 상처와 피해자 의식에서 벗어나, 그 고난 속에 담긴 섭리적 의미를 발견하고 해석할 수 있습니까?",
"남들에게 '괜찮은 사람'으로 보이고 싶어 하는 페르소나(가면)를 내려놓고, 하나님과 끝까지 씨름하여 '속이는 자(야곱)'에서 '하나님과 겨루어 이긴 자(이스라엘)'로 새롭게 태어나는 경험을 하고 있습니까?",
"타인의 오해나 비난에 노출되었을 때, 분노와 억울함이 오래가지 않고 내면의 맑은 평온을 유지할 수 있습니까?",
"완벽하지 못한 자신에 대한 자책을 멈추고, 약점과 연약함을 지닌 자기 자신을 있는 그대로 품어주는 자기 자비(Self-Compassion)가 일어납니까?",
"머리로 깨달은 영적·심리적 지혜가 단순한 지적 만족을 넘어, 실제 일상의 습관과 구체적 행동 패턴의 변화로 나타나고 있습니까?",
"억울하거나 서운한 상황을 마주할 때, 즉각적으로 반응하지 않고 숨을 고르며 반응을 늦출 수 있는 내적인 힘이 있습니까?",
"\"내가 이렇게까지 했는데 어떻게 나한테 이러할 수 있는가?\"라는 보상 심리와 인과응보적 신념체계가 무너지는 시련을 견뎌내고 있습니까?",
"\"내 생각만 옳다\"는 편협한 고집과 완벽주의가 하나님의 큰 자비 앞에서 깨지고, 사물의 본질을 있는 그대로 바라보는 관점의 전환을 받아들이고 있습니까?",
"\"언젠가 상황이 좋아지겠지\"라는 환상과 미루기 습관에서 벗어나, 지금 당장 마주해야 할 냉혹한 현실을 직면하고 있습니까?",
"타인을 판단하고 비판하던 배타적인 언어 습관이, 사람을 살리고 안아주는 따뜻하고 명확한 대화법으로 바뀌었습니까?",
"타인의 시선, 인정, SNS의 평가에 휩쓸리지 않고, 내면의 확고한 중심 가치관에 따라 선택을 내리고 있습니까?",
"삶을 바라보는 인식과 믿음의 중심이 나 자신(Ego)의 욕망에서 자기(Self)의 뜻과 전체적 하모니로 이동했음을 느낍니까?",
"'해야 한다'는 율법적 강박과 의무감에서 벗어나, 은혜와 사랑에 기반한 내적 원동력으로 살아가고 있습니까?",
"세속적인 소음, 권력, 세상의 압박 속에서도 내면의 영적 정체성과 거룩함의 경계를 흔들림 없이 유지합니까?",
"내가 얻은 깨달음과 영적 지식이 머리에만 머물지 않고, 주변 사람들을 대하는 온유함과 따뜻한 인품으로 인격화되었습니까?",
"나 개인의 정화나 구원의 차원을 넘어, 세상을 살리고 섬기고자 하는 소명(Vocation)의 의식이 내면에서 싹트고 있습니까?",
"내면의 깨달음과 영적 일루미네이션(빛)의 안락함에만 머물지 않고, 불완전하고 혼란스러운 현실 속으로 직접 들어갈 용기가 있습니까?",
"소신 있는 실천과 사명을 위해 타인의 비판, 불이익, 또는 개인적 손해를 감수할 각오가 되어 있습니까?",
"내가 가진 지혜가 시간 사용, 돈의 흐름, 대인관계 양식 등 눈에 보이는 삶의 열매로 나타나고 있습니까?",
"공동체의 성장과 후배/다음 세대의 유익을 위해 나의 시간과 에너지를 기꺼이 내어주고 있습니까?",
"세상의 비조화와 문제점들에 대해 비판만 하는 것을 멈추고, 작지만 실질적인 개선을 위해 손발을 움직입니까?",
"\"아직 준비가 안 됐다\"는 핑계로 사명과 헌신을 뒤로 미루는 '영적 미루기'에서 벗어났습니까?",
"내가 이룬 성과나 공로를 독점하려 하지 않고, 세상을 살리는 통로로 나누는 겸손함을 가지고 있습니까?",
"내면의 영적 통찰이 오늘 하루의 일터, 가정, 대인관계 등 아주 구체적인 일상의 삶 속에서 열매 맺고 있습니까?",
"과거의 도망자 같던 연약함과 두려움을 벗어던지고, 내면의 거룩한 불꽃으로 대의와 사명에 헌신하고 있습니까?",
"나의 삶 전체가 하나님과 세상을 잇는 통로가 되어, 나를 만나는 사람들에게 은혜와 생명을 전달하고 있습니까?",
"칼 융이 말한 \"자기(Self)는 중심일 뿐만 아니라 의식과 무의식을 모두 포괄하는 전체 둘레\"라는 명제처럼, 빛과 그림자, 영성과 일상이 온전히 하나로 통합되었음을 느낍니까?",
"약속된 결실을 일구어낸 후에도 성취에 안주하지 않고, 삶을 온전히 세상을 위해 나누며 겸손하게 새로운 순환을 맞이할 준비가 되어 있습니까?"
];
var API_URL="";   // 구글 Apps Script 웹앱 주소를 여기에 넣으면 응답이 인도자에게 전달됩니다
var KEY="life34_answers";
var CODE="",NAME="";
try{CODE=localStorage.getItem("life34_code")||"";NAME=localStorage.getItem("life34_name")||"";}catch(e){}
var ans={},step=0;
try{ans=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){ans={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ans));}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var app=document.getElementById("app");

function intro(){
 var has=Object.keys(ans).length>0;
 var h='<h1>내 삶의 위치를 알아볼 수 있는 34가지 질문</h1><hr class="rule">'+
 '<p>정답은 없습니다. 지금의 나에게 가장 가까운 답을 골라 주세요. 모두 여섯 쪽이고, 10분 정도 걸립니다.</p>';
 if(API_URL){
  h+='<p class="note">인도자에게 받은 접속번호를 입력해 주세요.</p>'+
   '<p><input id="code" inputmode="numeric" autocomplete="off" placeholder="접속번호" value="'+esc(CODE)+'" style="font:inherit;padding:.6em .8em;width:12em;border:1px solid #cfc6b0"></p>'+
   '<p id="cmsg" class="note"></p>';
 }else{
  h+='<p class="note">답은 이 기기 안에만 저장되며 어디로도 전송되지 않습니다.</p>';
 }
 h+='<div class="nav"><span></span><button id="go">'+(has?'이어서 하기':'시작하기')+'</button></div>'+
 (has?'<p class="note"><a href="#" id="reset">처음부터 다시 하기</a></p>':'');
 app.innerHTML=h;
 document.getElementById("go").onclick=function(){
  if(!API_URL){step=0;page();return;}
  var c=document.getElementById("code").value.replace(/\s/g,"");
  var m=document.getElementById("cmsg");
  if(!c){m.textContent="접속번호를 입력해 주세요.";return;}
  m.textContent="확인 중입니다...";
  fetch(API_URL+"?action=check&code="+encodeURIComponent(c)).then(function(r){return r.json();}).then(function(j){
   if(!j.ok){m.textContent="접속번호를 찾을 수 없습니다. 다시 확인해 주세요.";return;}
   CODE=c;NAME=j.name||"";
   try{localStorage.setItem("life34_code",CODE);localStorage.setItem("life34_name",NAME);}catch(e){}
   step=0;page();
  }).catch(function(){m.textContent="연결에 실패했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.";});
 };
 var r=document.getElementById("reset");
 if(r)r.onclick=function(e){e.preventDefault();ans={};save();intro();};
}
function sendResult(pos){
 var m=document.getElementById("sendmsg");if(!m)return;
 var a="";for(var n=1;n<=34;n++)a+=(ans[n]||0);
 m.textContent="응답을 전달하는 중입니다...";
 fetch(API_URL+"?action=save&code="+encodeURIComponent(CODE)+"&a="+a+"&pos="+pos).then(function(r){return r.json();}).then(function(j){
  m.textContent=j.ok?"응답이 인도자에게 전달되었습니다.":"전달하지 못했습니다. 접속번호를 확인해 주세요.";
 }).catch(function(){
  m.innerHTML='전달하지 못했습니다. 인터넷 연결을 확인하고 <a href="#" id="retry">다시 보내기</a>를 눌러 주세요.';
  var t=document.getElementById("retry");if(t)t.onclick=function(e){e.preventDefault();sendResult(pos);};
 });
}
function page(){
 var S=STAGES[step],h='';
 h+='<div class="bar"><i style="width:'+Math.round(step/6*100)+'%"></i></div>';
 h+='<p class="stagehead">'+(step+1)+' / 6</p>';
 for(var n=S.q[0];n<=S.q[1];n++){
  var q=Q[n],opts=(typeof q==="object")?q.o:SCALE,text=(typeof q==="object")?q.t:q;
  h+='<div class="q"><p class="t">'+n+'. '+esc(text)+'</p>';
  for(var v=0;v<4;v++){
   h+='<label class="opt"><input type="radio" name="q'+n+'" value="'+(v+1)+'"'+(ans[n]==v+1?' checked':'')+'>'+esc(opts[v])+'</label>';
  }
  h+='</div>';
 }
 h+='<p id="warn" class="note hidden">답하지 않은 문항이 있습니다.</p>';
 h+='<div class="nav"><button class="ghost" id="back">이전</button><button id="next">'+(step==5?'결과 보기':'다음')+'</button></div>';
 app.innerHTML=h;
 var radios=app.querySelectorAll("input[type=radio]");
 for(var i=0;i<radios.length;i++)radios[i].onchange=function(){ans[this.name.slice(1)]=parseInt(this.value);save();document.getElementById("warn").className="note hidden";};
 document.getElementById("back").onclick=function(){if(step==0)intro();else{step--;page();window.scrollTo(0,0);}};
 document.getElementById("next").onclick=function(){
  for(var n=S.q[0];n<=S.q[1];n++){if(!ans[n]){document.getElementById("warn").className="note";return;}}
  if(step==5)result();else{step++;page();window.scrollTo(0,0);}
 };
}
function avg(S){var s=0,c=0;for(var n=S.q[0];n<=S.q[1];n++){s+=ans[n]||0;c++;}return s/c;}
function levelText(S,a){
 if(a>=3.25)return "이 자리의 과제를 이미 깊이 지나오셨습니다. "+S.can+"이 몸에 배어 있습니다.";
 if(a>=2.75)return "이 자리가 어느새 익숙해졌습니다. "+S.can+"이 삶 속에서 자라고 있습니다.";
 if(a>=2.0)return "지금 이 자리를 걸어가는 중입니다. "+S.hint;
 return "아직 이 자리를 만나지 않았거나, 지금은 쉬어 가는 중일 수 있습니다. 서두르지 않아도 됩니다. "+S.hint;
}
function result(){
 var av=STAGES.map(avg),pos=-1;
 for(var i=0;i<6;i++){if(av[i]<2.75){pos=i;break;}}
 var best=0;for(i=1;i<6;i++)if(av[i]>av[best])best=i;
 var h='<h1>'+(NAME?esc(NAME)+' 님의 지금 위치':'나의 지금 위치')+'</h1><hr class="rule">';
 h+='<div class="pos"><p style="margin:0">';
 if(pos==-1)h+='여섯 자리 모두에서 고르게 힘이 자라 있습니다. 한 바퀴를 돌아 새로운 순환을 맞이하는 자리에 서 계십니다.';
 else if(pos==0)h+='지금은 <b>'+STAGES[0].name+'</b>, 곧 '+STAGES[0].title+'의 자리를 지나고 계십니다. 이 자리는 약해서 서는 자리가 아니라, 새로 시작하기 위해 서는 자리입니다.';
 else h+='가장 뚜렷한 힘은 <b>'+STAGES[best].name+'</b>의 '+STAGES[best].title+'에서 드러납니다. 지금 걸어가고 계신 자리는 <b>'+STAGES[pos].name+'</b>, 곧 '+STAGES[pos].title+'입니다. 앞선 자리들이 이미 든든한 바탕이 되어 있습니다.';
 h+='</p></div>';
 if(pos>=0&&STAGES[pos].trans)h+='<p>한 자리에서 다음 자리로 건너가는 일은 누구에게나 쉽지 않습니다. 더디게 느껴지는 것은 부족해서가 아니라 그만큼 큰 건너감이기 때문입니다.</p>';
 h+='<h3>여섯 자리의 모습</h3>';
 for(i=0;i<6;i++){
  var S=STAGES[i],a=av[i],on=Math.round(a);
  h+='<div class="card"><h4>'+S.n+' '+S.name+'</h4><p class="note" style="margin:0">'+S.title+'</p><div class="meter">';
  for(var k=1;k<=4;k++)h+='<b'+(k<=on?' class="on"':'')+'></b>';
  h+='</div><p style="margin:.2em 0">'+levelText(S,a)+'</p></div>';
 }
 var lows=[];for(var n=1;n<=34;n++)lows.push([ans[n]||0,n]);
 lows.sort(function(x,y){return x[0]-y[0]||x[1]-y[1];});
 h+='<h3>천천히 다시 바라보면 좋을 질문</h3><p class="note">점수가 낮다는 뜻이 아니라, 지금 마음이 머무는 곳일 수 있다는 뜻입니다.</p>';
 for(i=0;i<3;i++){
  var qq=Q[lows[i][1]];var tx=(typeof qq==="object")?qq.t:qq;
  h+='<p class="qn">'+lows[i][1]+'. '+esc(tx)+'</p>';
 }
 h+=(API_URL&&CODE?'<p id="sendmsg" class="note"></p>':'');
 h+='<div class="nav"><button class="ghost" id="again">처음부터 다시</button><button id="print">저장 또는 인쇄</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById("again").onclick=function(){ans={};save();step=0;intro();};
 document.getElementById("print").onclick=function(){window.print();};
 if(API_URL&&CODE)sendResult(pos==-1?"완성":STAGES[pos].name);
}
intro();
</script>
</body>
</html>
